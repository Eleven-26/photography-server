services:
  # 数据库
  mysql:
    image: mysql:8.0
    container_name: photography-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 从 .env 读取
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photography}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=${MYSQL_CHARSET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_unicode_ci}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./volume/mysql/data}:/var/lib/mysql
      - ${MYSQL_CONF_DIR:-./volume/mysql/conf}:/etc/mysql/conf.d
      # ===== 首次初始化脚本（/docker-entrypoint-initdb.d/）=====
      # mysql 官方镜像【仅在数据卷为空时】按文件名字典序执行本目录下的 *.sql；
      # 已有数据的库一律跳过 -> 天然幂等，对现网零风险，可放心保留。
      # 顺序由文件名前缀决定：第三方组件 schema 在前、业务库表在后。
      #   nacos 库表（13 张，Nacos 3.x 的 MySQL 存储）
      - ${MYSQL_INITDB_NACOS:-./photography-server/docs/sql/initdb/01-nacos-schema.sql}:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
      #   xxl_job 库表（xxl-job-admin 首启必需）
      - ${MYSQL_INITDB_XXLJOB:-./photography-server/docs/sql/initdb/02-xxl-job-tables.sql}:/docker-entrypoint-initdb.d/02-xxl-job-tables.sql:ro
      #   业务库表 + 初始数据（自带 CREATE DATABASE photography + USE，见 docs/sql/README.md）
      - ${MYSQL_INITDB_DDL:-./photography-server/docs/sql/ddl.sql}:/docker-entrypoint-initdb.d/03-business-ddl.sql:ro
      - ${MYSQL_INITDB_DML:-./photography-server/docs/sql/dml.sql}:/docker-entrypoint-initdb.d/04-business-dml.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 缓存
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: photography-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-./volume/redis/data}:/data
    command: redis-server --appendonly ${REDIS_AOF:-yes}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTH_INTERVAL:-5s}
      timeout: ${REDIS_HEALTH_TIMEOUT:-5s}
      retries: ${REDIS_HEALTH_RETRIES:-10}
    networks:
      - backend-net

  # 队列
  nats:
    image: nats:${NATS_VERSION:-2.10-alpine}
    container_name: photography-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: ["-c", "/etc/nats/nats.conf", "-js", "-sd", "/data"]
    volumes:
      - ${NATS_CONF_DIR:-./volume/nats/conf}/nats.conf:/etc/nats/nats.conf:ro
      - ${NATS_DATA_DIR:-./volume/nats/data}:/data
    healthcheck:
      # 监控端口（8222）的 /healthz；alpine 镜像自带 busybox wget。
      # 前提是 nats.conf 里配了 http_port: 8222，否则监控端口不开、本探针恒失败。
      #   模板见 config/nats.example.conf，部署时须先 cp 到 ${NATS_CONF_DIR}/nats.conf
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: ${NATS_HEALTH_INTERVAL:-5s}
      timeout: ${NATS_HEALTH_TIMEOUT:-3s}
      retries: ${NATS_HEALTH_RETRIES:-12}
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net

  # XXL-JOB 任务调度中心
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXLJOB_ADMIN_VERSION:-3.4.2}
    container_name: photography-xxl-job-admin
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${XXLJOB_DB_HOST:-mysql}:${XXLJOB_DB_PORT:-3306}/${XXLJOB_DB_NAME:-xxl_job}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${XXLJOB_DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVER_PORT: 8080
      XXLJOB_ACCESS_TOKEN: ${XXLJOB_ACCESS_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${XXLJOB_ADMIN_EXPOSE_PORT:-9100}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # xxl-job-admin 镜像内是否带 curl/wget 不确定，故双候选；
      # 都不可用时会恒为 unhealthy —— 但它【不阻塞 backend】（见 backend.depends_on），
      # 只影响 docker compose ps 观感，可按需删除本节。
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:8080/xxl-job-admin/ || wget -q -O /dev/null http://127.0.0.1:8080/xxl-job-admin/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend-net

  # 搜索引擎（Elasticsearch）——【可选组件，默认不随 up 启动】
  # 现状：service / repository 层零引用（grep 计数 0），仅 /test/es/* 调试接口使用；
  #   prod 的 nacos 配置 elasticsearch.enable=false，代码侧未启用时 App.ES=nil 并降级，非强依赖。
  # 故列入 debug profile：避免每次 up 白起容器（默认 512MB heap）并拖慢后端启动。
  # 需要本地调试时：docker compose --profile debug up -d   （或 make docker-up-debug）
  elasticsearch:
    profiles: ["debug"]
    image: elasticsearch:${ES_VERSION:-8.19.0}
    container_name: photography-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - ${ES_DATA_DIR:-./volume/elasticsearch/data}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || curl -s http://localhost:9200/_cat/health | grep -q yellow"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 文档数据库（MongoDB）——【可选组件，默认不随 up 启动】
  # 现状：service / repository 层零引用，仅 /test/mongo/* 调试接口使用；
  #   prod 的 nacos 配置 mongodb.enable=false。同 ES，列入 debug profile。
  mongo:
    profiles: ["debug"]
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: photography-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_DIR:-./volume/mongo/data}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 链路追踪（SkyWalking native 栈）：BanyanDB（存储）+ OAP（后端） + Horizon UI
  # 数据流：backend（注入 skywalking-go agent）--native gRPC:11800--> OAP --> BanyanDB
  # 版本说明：OAP 11.0.0 配套 BanyanDB 0.11.0；11.0 起官方 UI 为 Horizon 版
  # （apache/skywalking-ui:horizon-*，容器内监听 8081，配置只认挂载的 horizon.yaml）；
  # OAP 的 17128 为 admin 端口，Horizon UI 的写 API 依赖它。
  # 另一条链路通道（OTel→Jaeger + ClickHouse）见下方 clickhouse/jaeger 服务，与本栈互不依赖。
  skywalking-banyandb:
    image: apache/skywalking-banyandb:${SW_BDB_VERSION:-0.11.0}
    container_name: photography-skywalking-banyandb
    ports:
      - "${SW_BDB_PORT:-17912}:17912"        # OAP 数据读写
      - "${SW_BDB_HTTP_PORT:-17913}:17913"   # 监控/管理
    volumes:
      - ${SW_BDB_DATA_DIR:-./volume/skywalking/banyandb/data}:/data
    command: standalone --observability-modes=native --stream-root-path /data/stream --measure-root-path /data/measure
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-net

  skywalking-oap:
    image: apache/skywalking-oap-server:${SW_OAP_VERSION:-11.0.0}
    container_name: photography-skywalking-oap
    depends_on:
      skywalking-banyandb:
        condition: service_healthy
    environment:
      - SW_STORAGE=banyandb
      - SW_STORAGE_BANYANDB_TARGETS=skywalking-banyandb:17912
      - SW_HEALTH_CHECKER=default
      # 仅服务 native 通道：skywalking-go agent 的 native gRPC 上报默认开启；
      # 已废弃 OTel→SkyWalking(zipkin) 通道，不再需要 receiver-zipkin/query-zipkin 与 9412。
      - JAVA_OPTS=${SW_OAP_JAVA_OPTS:--Xms512m -Xmx512m}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${SW_OAP_GRPC_PORT:-11800}:11800"   # skywalking-go agent native gRPC 上报
      - "${SW_OAP_QUERY_PORT:-12800}:12800"  # REST/GraphQL 查询（Horizon UI 用）
      - "${SW_OAP_ADMIN_PORT:-17128}:17128"  # admin（Horizon UI 写 API 用）
    healthcheck:
      # 新版 OAP 镜像无 curl，用 bash 内置 /dev/tcp 探测
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/12800"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - backend-net

  skywalking-ui:
    image: apache/skywalking-ui:${SW_UI_VERSION:-horizon-1.0.0}
    container_name: photography-skywalking-ui
    depends_on:
      skywalking-oap:
        condition: service_healthy
    volumes:
      # Horizon UI 的 OAP 地址与登录用户只从该文件读取（无 env 注入入口），必须挂载
      - ${SW_UI_CONFIG_FILE:-./volume/horizon/horizon.yaml}:/app/horizon.yaml:ro
    ports:
      - "${SW_UI_PORT:-9080}:8081"   # Horizon 容器内监听 8081
    restart: unless-stopped
    networks:
      - backend-net

  # ===== Jaeger 链路通道（与上方 SkyWalking native 栈互不依赖，二选一使用，不建议同开）=====
  # 数据流：backend --OTLP:4317--> jaeger(collector+query 一体) --native--> clickhouse
  # 版本说明：ClickHouse 存储为 Jaeger v2.18.0 起的官方原生后端（alpha），无需 ES / 三方 grpc-plugin；
  #   启用方式：后端不注入 sw-go agent，设 APP_JAEGER_ENABLE=true 且 APP_JAEGER_ENDPOINT=jaeger:4317
  #   （配置段 jaeger.*，复用 OTel 埋点）；数据落 clickhouse.jaeger 库，
  #   UI 由 jaeger 单进程内置（:16686），支持按 trace_id 精确检索。
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: photography-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-jaeger}   # 启动时自动创建该库（Jaeger 不自己建库）
      # 可选加固：设 CLICKHOUSE_USER/CLICKHOUSE_PASSWORD 后，须同步到 config/jaeger 配置的 auth.basic
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-root}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-root}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CLICKHOUSE_PORT:-9000}:9000"          # native 协议（Jaeger 连接用）
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP 接口（调试用）
    volumes:
      - ${CLICKHOUSE_DATA_DIR:-./volume/clickhouse/data}:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-net

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.18.0}
    container_name: photography-jaeger
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ${JAEGER_CONFIG_FILE:-./volume/jaeger/config.yaml}:/etc/jaeger/config.yaml:ro
    # ClickHouse 存储是 Jaeger v2 的实验特性，默认关闭且**配置文件里没有对应字段** —— 必须在命令行显式开门，
    # 否则容器启动即退出：ClickHouse storage is experimental and must be explicitly enabled.
    # v2.20 该 gate 仍为 Alpha；v2.23 起转 Stable 并更名 jaeger.clickhouse（旧 ID 保留为兼容别名，两者都收）。
    command: ["--config", "/etc/jaeger/config.yaml", "--feature-gates=${JAEGER_FEATURE_GATES:-storage.clickhouse}"]
    ports:
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"    # 应用 OTLP gRPC 上报入口
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"    # 应用 OTLP HTTP 上报入口
      - "${JAEGER_UI_PORT:-16686}:16686"         # Jaeger UI
    restart: unless-stopped
    networks:
      - backend-net

  # ===== Nacos 配置中心 + 注册中心（唯一业务配置源，backend 硬依赖）=====
  # standalone 模式 + MySQL 存储：3.x 起内嵌 Derby 落在【容器可写层】（本服务从未挂可写卷），
  # recreate 即丢全部配置与注册信息；切 MySQL 后配置才真正持久化，库表由 mysql 的 initdb 建好。
  # 数据源 env 映射（对应官方镜像 conf/application.properties 模板）：
  #   SPRING_DATASOURCE_PLATFORM -> spring.sql.init.platform（留空=Derby，mysql=MySQL）
  #   MYSQL_SERVICE_*            -> db.url.0 / db.user.0 / db.password.0
  #   注意：3.x 用 spring.sql.init.platform，与 2.x 的 spring.datasource.platform 不同名，勿照抄旧文档。
  #   "库表先于服务"是真依赖：故 depends_on mysql 且等 healthy；nacos 库由
  #      docs/sql/initdb/01-nacos-schema.sql 建好（13 张表）。
  # v3 控制台为独立端口（容器内 8080，宿主经 NACOS_CONSOLE_PORT 访问）；v2 旧版控制台在 http://localhost:8848/nacos。
  # 客户端 SDK 走 gRPC：9848 = 8848+1000，映射端口必须保持该偏移关系。
  # 业务配置发布：data_id=photography-server-<profile>.yaml，模板见 config/nacos/（未发布则 backend fail-fast）；
  #   发布由一次性容器 nacos-init 承担，见下方服务。
  # 鉴权三件套：NACOS_AUTH_ENABLE=true 时 TOKEN / IDENTITY_KEY / IDENTITY_VALUE 缺一即 exit 255
  # （脚本报 "env NACOS_AUTH_IDENTITY_KEY must be set."）。IDENTITY 为服务端间识别头，standalone 也必填；
  # Go 客户端不使用它们，连接只需 APP_NACOS_USERNAME/PASSWORD。
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.2.4}
    container_name: photography-nacos
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MODE=standalone
      # ---- 存储：MySQL ----
      - SPRING_DATASOURCE_PLATFORM=${NACOS_DB_PLATFORM:-mysql}
      - MYSQL_SERVICE_HOST=${NACOS_DB_HOST:-mysql}
      - MYSQL_SERVICE_PORT=${NACOS_DB_PORT:-3306}
      - MYSQL_SERVICE_DB_NAME=${NACOS_DB_NAME:-nacos}
      - MYSQL_SERVICE_USER=${NACOS_DB_USER:-root}
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # allowPublicKeyRetrieval 为 MySQL 8 caching_sha2_password 认证所需，勿删
      - "MYSQL_SERVICE_DB_PARAM=${NACOS_DB_PARAM:-characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
      # ---- 鉴权 ----
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-false} # 开启后须同步设置 APP_NACOS_USERNAME/PASSWORD
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-}
      - JVM_XMS=${NACOS_JVM_XMS:-256m}
      - JVM_XMX=${NACOS_JVM_XMX:-512m}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${NACOS_PORT:-8848}:8848"      # OpenAPI（v2 控制台也在 8848/nacos）
      - "${NACOS_GRPC_PORT:-9848}:9848" # gRPC（客户端 SDK 实际连接端口）
      - "${NACOS_CONSOLE_PORT:-8850}:8080" # v3 控制台（独立端口，勿用 8080 宿主位——backend 已占）
    healthcheck:
      # 候选端点按"开鉴权后仍免登录"优先：/v1/console/health/** 在官方 nacos.security.ignore.urls
      # 白名单内；/v3/admin/** 受 nacos.core.auth.admin.enabled 管控（默认 true -> 需鉴权），仅作兜底。
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:8848/nacos/v1/console/health/readiness || curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s   # 冷启 + 建库表耗时，给足
    restart: unless-stopped
    networks:
      - backend-net

  # ===== Nacos 一次性初始化（把"数据级依赖"纳入编排）=====
  # 职责：① 初始化管理员（Nacos 3.x 起用户表为空，不再预置 nacos/nacos）；
  #       ② 发布业务配置 data_id（未发布则 backend 拉配置 fail-fast，连 MySQL 之前就死）。
  # 这两件事 depends_on 表达不了 —— 交给一个【跑完即退】的容器，
  # backend 以 service_completed_successfully 等它退出码 0（见 backend.depends_on）。
  # 幂等：每次 up 都会重放本容器（它不是常驻服务），脚本内三步全部"已达成即跳过"：
  #   能登录=管理员已建 -> 跳过初始化；远端配置与模板一致 -> 跳过推送。等于每次 up 自动校准配置。
  # 镜像直接复用 nacos-server（内含 bash + curl），无需额外拉 init 镜像。
  # 调试期想临时关掉：.env 设 NACOS_INIT_ENABLE=false（容器秒退且退出码 0，不阻塞 backend）。
  nacos-init:
    image: ${NACOS_INIT_IMAGE:-nacos/nacos-server:v3.2.4}
    container_name: photography-nacos-init
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      - NACOS_SERVER=http://nacos:8848
      - NACOS_ADMIN_USERNAME=${APP_NACOS_USERNAME:-nacos}
      - NACOS_ADMIN_PASSWORD=${APP_NACOS_PASSWORD:-}
      - NACOS_INIT_ENABLE=${NACOS_INIT_ENABLE:-true}
      - NACOS_INIT_FORCE_PUSH=${NACOS_INIT_FORCE_PUSH:-false}
      - NACOS_INIT_TIMEOUT=${NACOS_INIT_TIMEOUT:-180}
      - APP_PROFILE=${APP_PROFILE:-prod}
      - APP_NACOS_GROUP=${APP_NACOS_GROUP:-DEFAULT_GROUP}
      - APP_NACOS_NAMESPACE=${APP_NACOS_NAMESPACE:-}
      - APP_NACOS_DATA_ID=${APP_NACOS_DATA_ID:-photography-server-${APP_PROFILE:-prod}.yaml}
      - APP_NACOS_APP_NAME=${APP_NACOS_APP_NAME:-photography-server}
      - NACOS_CONFIG_DIR=/config
    volumes:
      - ${NACOS_INIT_SCRIPT:-./photography-server/scripts/nacos_init.sh}:/init.sh:ro
      # 配置模板目录（photography-server-<profile>.yaml），与 scripts/nacos_publish.sh 共用同一份
      - ${NACOS_CONFIG_DIR:-./photography-server/config/nacos}:/config:ro
    entrypoint: ["bash", "/init.sh"]
    restart: "no"       # 一次性容器：禁止 always，否则 service_completed_successfully 永远等不到
    networks:
      - backend-net
  # 后端服务
  backend:
    build:
      context: ${BACKEND_CONTEXT:-./photography-server}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        # SkyWalking Go agent 注入构建：SW_AGENT_ENABLE=true 时产物内织入 agent，
        # 走 native 通道（直连 OAP:11800）；false 时不注入（Jaeger 通道/纯 OTel 埋点）。
        # 注：native 构建运行期须保持 APP_JAEGER_ENABLE=false，避免 OTel 与 native 双上报。
        SW_AGENT_ENABLE: ${SW_AGENT_ENABLE:-false}
        SW_AGENT_VERSION: ${SW_AGENT_VERSION:-0.7.0}
        SW_AGENT_SERVICE: ${SW_AGENT_SERVICE:-photography-server}
        SW_AGENT_BACKEND: ${SW_AGENT_BACKEND:-skywalking-oap:11800}
        # Go 构建标签：默认空 = 生产纯净二进制（不含 /test 基础设施调试接口）；
        # 容器内需要调试时在 .env 设 GO_BUILD_TAGS=debug 后重新 build。
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}
    image: chenkangfu/photography-server:${VERSION:-latest}  # 通过环境变量传入版本
    container_name: photography-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy   # 原为 service_started：容器起了不等于能订阅
      xxl-job-admin:
        condition: service_started
      # elasticsearch / mongo 已从 depends_on 移除：二者属 debug profile 的可选组件，
      # 且代码侧为可选依赖（未启用 → App.ES/App.Mongo 为 nil，调用方判空降级），
      # 不应阻塞后端启动（原先 elasticsearch: service_healthy 会让后端被 ES 拖住，甚至 ES 起不来则后端永不起）。
      # 如需在容器里联调：docker compose --profile debug up -d
      # 仅 native 通道需要（OAP 未就绪时 agent 上报会自行重试）；
      # 只跑 Jaeger 通道时可注释掉本项，避免每次 up 都拉起整套 SkyWalking 栈
      skywalking-oap:
        condition: service_started
      # Nacos 是唯一业务配置源（硬依赖）：既要【容器就绪】也要【配置已发布】。
      # 后者是数据级状态，compose 表达不了 —— 只能等"负责发配置的那个容器成功退出"。
      nacos:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    environment:
      # 【业务配置一律不在容器 env 里】app.mode / jwt.* / db.* / redis.* / nats.* / mongodb.* /
      # log.* / upload.* / xxljob.* / elasticsearch.* / jaeger.* 100% 来自 Nacos：
      # data_id=photography-server-${APP_PROFILE}.yaml（模板见 config/nacos/，未发布则 fail-fast）。
      # 排障时临时加回 APP_* 环境变量即可覆盖（viper env 优先级最高），用完删掉。
      APP_PROFILE: ${APP_PROFILE:-prod}   # 决定拉取哪个 data_id（自举变量，必须保留）
      # 配置密文主密钥（KEK）：解密 Nacos 模板里的 ENCv1: 密文。不能存 Nacos（自举死循环）。
      # 生产更推荐文件方式：把密钥写入 secrets/config_secret（已 gitignore），
      # 再挂 secrets 并改设 APP_CONFIG_SECRET_FILE: /run/secrets/config_secret
      APP_CONFIG_SECRET: ${APP_CONFIG_SECRET:-}
      APP_CONFIG_SECRET_PREV: ${APP_CONFIG_SECRET_PREV:-}   # 仅密钥轮换期使用（只解密）
      # 以下业务段（xxljob / elasticsearch / mongodb / jaeger）已从 env 摘除，全部由 Nacos 提供，
      # 勿再加回，避免两处配置漂移。
      # 链路追踪两通道（各自独立，勿同开，否则同一请求产双 span/双上报）：
      # 通道① SkyWalking-go（native）：SW_AGENT_ENABLE=true 构建注入 agent 后生效，agent 直连 OAP:11800，
      #   数据进 native 模块（Horizon「原生」模式 + 拓扑/指标分析）；此时 jaeger.enable 须为 false；
      # 通道② OTel→Jaeger（复用 OTel 埋点，不注入 agent）：Nacos 里 jaeger.enable=true 且
      #   endpoint=jaeger:4317，数据落 ClickHouse，Jaeger UI(:16686) 按 trace_id 精确检索。
      #   应急覆盖仍可用 APP_JAEGER_*（对应 config 的 jaeger 段）。
      # Nacos 配置中心 + 注册中心：本地 yaml 只是 bootstrap，业务配置 100% 从 Nacos 拉取（无开关）
      APP_NACOS_SERVER_ADDR: ${APP_NACOS_SERVER_ADDR:-nacos:8848}
      APP_NACOS_NAMESPACE: ${APP_NACOS_NAMESPACE:-}
      APP_NACOS_GROUP: ${APP_NACOS_GROUP:-DEFAULT_GROUP}
      APP_NACOS_DATA_ID: ${APP_NACOS_DATA_ID:-photography-server-${APP_PROFILE:-prod}.yaml}
      APP_NACOS_USERNAME: ${APP_NACOS_USERNAME:-}
      APP_NACOS_PASSWORD: ${APP_NACOS_PASSWORD:-}
      APP_NACOS_SERVICE_NAME: ${APP_NACOS_SERVICE_NAME:-photography-server}
      APP_NACOS_REGISTER_IP: ${APP_NACOS_REGISTER_IP:-} # 注册 IP，留空自动探测（容器内为容器 IP）
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # 本地仅挂 bootstrap（Nacos 连接信息）；业务配置 100% 来自 Nacos（data_id 按 APP_PROFILE 区分）
      - ${BACKEND_CONFIG_FILE:-./photography-server/config/config.yaml}:/app/config/config.yaml:ro
      - ${UPLOADS_DIR:-./volume/uploads}:/app/uploads
      # SDK 本地快照持久化：容器重启后即使 Nacos 短暂不可用也可用快照兜底启动
      - ${NACOS_CLIENT_CACHE_DIR:-./volume/nacos-client/cache}:/app/.nacos/cache
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  # 前端服务（PC 管理端）
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-./photography-frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    image: chenkangfu/photography-frontend:${VERSION:-latest}  # 通过环境变量传入版本
    container_name: photography-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - frontend-net

  # ===== h5 站点（客户端 · SLOT 摄影预约）=====
  # uni-app(Vue3) 编译的静态站点，nginx 托管 + /api 反代 backend（剥前缀）。
  # 构建：photography-h5/Dockerfile 两阶段（node:20-alpine 编译 → nginx:1.27-alpine），
  # 产物在 dist/build/h5（uni-app 的 H5 平台目录，不是 dist 根）。
  # 后端前缀 /h5/*：前端请求 /api/h5/xxx → nginx 剥 /api → backend:8080/h5/xxx。
  h5:
    build:
      context: ${H5_CONTEXT:-./photography-h5}
      dockerfile: ${H5_DOCKERFILE:-Dockerfile}
    image: chenkangfu/photography-h5:${VERSION:-latest}
    container_name: photography-h5
    depends_on:
      - backend
    ports:
      - "${H5_PORT:-8082}:80"
    restart: unless-stopped
    networks:
      - frontend-net

  # ===== wechat 站点（员工端 · SLOT 摄影师端）=====
  # 与 h5 站点同源工程结构；容器只托管 H5 形态（微信小程序形态由微信开发者工具上传，不经容器）。
  # 本端有两个端前缀：员工端 /wechat/staff/*、客户区 /wechat/*，nginx 统一剥 /api 后转发。
  wechat:
    build:
      context: ${WECHAT_CONTEXT:-./photography-wechat}
      dockerfile: ${WECHAT_DOCKERFILE:-Dockerfile}
    image: chenkangfu/photography-wechat:${VERSION:-latest}
    container_name: photography-wechat
    depends_on:
      - backend
    ports:
      - "${WECHAT_PORT:-8083}:80"
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge