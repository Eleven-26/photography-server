services:
  # 数据库
  mysql:
    image: mysql:8.0
    container_name: photography-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 从 .env 读取
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photography}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=${MYSQL_CHARSET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_unicode_ci}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql/data}:/var/lib/mysql
      - ${MYSQL_CONF_DIR:-./mysql/conf}:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 缓存
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: photography-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-./redis/data}:/data
    command: redis-server --appendonly ${REDIS_AOF:-yes}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTH_INTERVAL:-5s}
      timeout: ${REDIS_HEALTH_TIMEOUT:-5s}
      retries: ${REDIS_HEALTH_RETRIES:-10}
    networks:
      - backend-net

  # 队列
  nats:
    image: nats:${NATS_VERSION:-2.10-alpine}
    container_name: photography-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: ["-c", "/etc/nats/nats.conf", "-js", "-sd", "/data"]
    volumes:
      - ${NATS_CONF_DIR:-./nats/conf}/nats.conf:/etc/nats/nats.conf:ro
      - ${NATS_DATA_DIR:-./nats/data}:/data
    restart: unless-stopped
    networks:
      - backend-net

  # XXL-JOB 任务调度中心
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXLJOB_ADMIN_VERSION:-3.4.2}
    container_name: photography-xxl-job-admin
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${XXLJOB_DB_HOST:-mysql}:${XXLJOB_DB_PORT:-3306}/${XXLJOB_DB_NAME:-xxl_job}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${XXLJOB_DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVER_PORT: 8080
      XXLJOB_ACCESS_TOKEN: ${XXLJOB_ACCESS_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${XXLJOB_ADMIN_EXPOSE_PORT:-9100}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  # 搜索引擎
  elasticsearch:
    image: elasticsearch:${ES_VERSION:-8.19.0}
    container_name: photography-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - ${ES_DATA_DIR:-./elasticsearch/data}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || curl -s http://localhost:9200/_cat/health | grep -q yellow"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 文档数据库
  mongo:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: photography-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_DIR:-./mongo/data}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 后端服务
  backend:
    build:
      context: ${BACKEND_CONTEXT:-./photography-server}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    image: chenkangfu/photography-server:${VERSION:-latest}  # 通过环境变量传入版本
    container_name: photography-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      xxl-job-admin:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      APP_MODE: ${APP_MODE:-release}
      APP_PROFILE: ${APP_PROFILE:-prod}
      APP_DB_HOST: ${APP_DB_HOST:-mysql}
      APP_DB_PORT: ${APP_DB_PORT:-3306}
      APP_DB_USER: ${APP_DB_USER:-root}
      APP_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 复用 MySQL 密码
      APP_DB_NAME: ${APP_DB_NAME:-photography}
      APP_REDIS_HOST: ${APP_REDIS_HOST:-redis}
      APP_REDIS_PORT: ${APP_REDIS_PORT:-6379}
      APP_NATS_URL: ${APP_NATS_URL:-nats://nats:4222}
      APP_JWT_SECRET: ${APP_JWT_SECRET}   # 必须从 .env 读取
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/uploads}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-warn}
      APP_XXLJOB_ENABLE: ${APP_XXLJOB_ENABLE:-true}
      APP_XXLJOB_SERVER_ADDR: ${APP_XXLJOB_SERVER_ADDR:-http://xxl-job-admin:8080/xxl-job-admin}
      APP_XXLJOB_ACCESS_TOKEN: ${XXLJOB_ACCESS_TOKEN:-}
      APP_XXLJOB_EXECUTOR_IP: ${APP_XXLJOB_EXECUTOR_IP:-127.0.0.1}
      APP_XXLJOB_EXECUTOR_PORT: ${APP_XXLJOB_EXECUTOR_PORT:-"9999"}
      APP_XXLJOB_REGISTRY_KEY: ${APP_XXLJOB_REGISTRY_KEY:-photography-server}
      APP_XXLJOB_LOG_DIR: ${APP_XXLJOB_LOG_DIR:-/app/logs/xxl-job}
      APP_ES_ENABLE: ${APP_ES_ENABLE:-false}
      APP_ES_URL: ${APP_ES_URL:-http://elasticsearch:9200}
      APP_ES_USERNAME: ${APP_ES_USERNAME:-}
      APP_ES_PASSWORD: ${APP_ES_PASSWORD:-}
      APP_MONGO_ENABLE: ${APP_MONGO_ENABLE:-false}
      APP_MONGO_URI: ${APP_MONGO_URI:-mongodb://mongo:27017}
      APP_MONGO_DATABASE: ${APP_MONGO_DATABASE:-photography}
      APP_MONGO_USERNAME: ${APP_MONGO_USERNAME:-}
      APP_MONGO_PASSWORD: ${APP_MONGO_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${BACKEND_CONFIG_FILE:-./photography-server/config/config.prod.yaml}:/app/config/config.yaml:ro
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  # 前端服务
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-./photography-frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    image: chenkangfu/photography-frontend:${VERSION:-latest}  # 通过环境变量传入版本
    container_name: photography-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge