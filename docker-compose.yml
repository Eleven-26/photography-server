services:
  # 数据库
  mysql:
    image: mysql:8.0
    container_name: photography-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 从 .env 读取
      MYSQL_DATABASE: ${MYSQL_DATABASE:-photography}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=${MYSQL_CHARSET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_unicode_ci}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./volume/mysql/data}:/var/lib/mysql
      - ${MYSQL_CONF_DIR:-./volume/mysql/conf}:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 缓存
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: photography-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_DIR:-./volume/redis/data}:/data
    command: redis-server --appendonly ${REDIS_AOF:-yes}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTH_INTERVAL:-5s}
      timeout: ${REDIS_HEALTH_TIMEOUT:-5s}
      retries: ${REDIS_HEALTH_RETRIES:-10}
    networks:
      - backend-net

  # 队列
  nats:
    image: nats:${NATS_VERSION:-2.10-alpine}
    container_name: photography-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    command: ["-c", "/etc/nats/nats.conf", "-js", "-sd", "/data"]
    volumes:
      - ${NATS_CONF_DIR:-./volume/nats/conf}/nats.conf:/etc/nats/nats.conf:ro
      - ${NATS_DATA_DIR:-./volume/nats/data}:/data
    restart: unless-stopped
    networks:
      - backend-net

  # XXL-JOB 任务调度中心
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXLJOB_ADMIN_VERSION:-3.4.2}
    container_name: photography-xxl-job-admin
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${XXLJOB_DB_HOST:-mysql}:${XXLJOB_DB_PORT:-3306}/${XXLJOB_DB_NAME:-xxl_job}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${XXLJOB_DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVER_PORT: 8080
      XXLJOB_ACCESS_TOKEN: ${XXLJOB_ACCESS_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${XXLJOB_ADMIN_EXPOSE_PORT:-9100}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  # 搜索引擎
  elasticsearch:
    image: elasticsearch:${ES_VERSION:-8.19.0}
    container_name: photography-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - ${ES_DATA_DIR:-./volume/elasticsearch/data}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || curl -s http://localhost:9200/_cat/health | grep -q yellow"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 文档数据库
  mongo:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: photography-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_DIR:-./volume/mongo/data}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: ${MYSQL_HEALTH_INTERVAL:-5s}
      timeout: ${MYSQL_HEALTH_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTH_RETRIES:-10}
    restart: unless-stopped
    networks:
      - backend-net

  # 链路追踪（SkyWalking native 栈）：BanyanDB（存储）+ OAP（后端） + Horizon UI
  # 数据流：backend（注入 skywalking-go agent）--native gRPC:11800--> OAP --> BanyanDB
  # 版本说明：OAP 11.0.0 配套 BanyanDB 0.11.0；11.0 起官方 UI 为 Horizon 版
  # （apache/skywalking-ui:horizon-*，容器内监听 8081，配置只认挂载的 horizon.yaml）；
  # OAP 的 17128 为 admin 端口，Horizon UI 的写 API 依赖它。
  # 另一条链路通道（OTel→Jaeger + ClickHouse）见下方 clickhouse/jaeger 服务，与本栈互不依赖。
  skywalking-banyandb:
    image: apache/skywalking-banyandb:${SW_BDB_VERSION:-0.11.0}
    container_name: photography-skywalking-banyandb
    ports:
      - "${SW_BDB_PORT:-17912}:17912"        # OAP 数据读写
      - "${SW_BDB_HTTP_PORT:-17913}:17913"   # 监控/管理
    volumes:
      - ${SW_BDB_DATA_DIR:-./volume/skywalking/banyandb/data}:/data
    command: standalone --observability-modes=native --stream-root-path /data/stream --measure-root-path /data/measure
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-net

  skywalking-oap:
    image: apache/skywalking-oap-server:${SW_OAP_VERSION:-11.0.0}
    container_name: photography-skywalking-oap
    depends_on:
      skywalking-banyandb:
        condition: service_healthy
    environment:
      - SW_STORAGE=banyandb
      - SW_STORAGE_BANYANDB_TARGETS=skywalking-banyandb:17912
      - SW_HEALTH_CHECKER=default
      # 仅服务 native 通道：skywalking-go agent 的 native gRPC 上报默认开启；
      # 已废弃 OTel→SkyWalking(zipkin) 通道，不再需要 receiver-zipkin/query-zipkin 与 9412。
      - JAVA_OPTS=${SW_OAP_JAVA_OPTS:--Xms512m -Xmx512m}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${SW_OAP_GRPC_PORT:-11800}:11800"   # skywalking-go agent native gRPC 上报
      - "${SW_OAP_QUERY_PORT:-12800}:12800"  # REST/GraphQL 查询（Horizon UI 用）
      - "${SW_OAP_ADMIN_PORT:-17128}:17128"  # admin（Horizon UI 写 API 用）
    healthcheck:
      # 新版 OAP 镜像无 curl，用 bash 内置 /dev/tcp 探测
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/12800"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - backend-net

  skywalking-ui:
    image: apache/skywalking-ui:${SW_UI_VERSION:-horizon-1.0.0}
    container_name: photography-skywalking-ui
    depends_on:
      skywalking-oap:
        condition: service_healthy
    volumes:
      # Horizon UI 的 OAP 地址与登录用户只从该文件读取（无 env 注入入口），必须挂载
      - ${SW_UI_CONFIG_FILE:-./volume/horizon/horizon.yaml}:/app/horizon.yaml:ro
    ports:
      - "${SW_UI_PORT:-9080}:8081"   # Horizon 容器内监听 8081
    restart: unless-stopped
    networks:
      - backend-net

  # ===== Jaeger 链路通道（与上方 SkyWalking native 栈互不依赖，二选一使用，不建议同开）=====
  # 数据流：backend --OTLP:4317--> jaeger(collector+query 一体) --native--> clickhouse
  # 版本说明：ClickHouse 存储为 Jaeger v2.18.0 起的官方原生后端（alpha），无需 ES / 三方 grpc-plugin；
  #   启用方式：后端不注入 sw-go agent，设 APP_JAEGER_ENABLE=true 且 APP_JAEGER_ENDPOINT=jaeger:4317
  #   （配置段 jaeger.*，复用 OTel 埋点）；数据落 clickhouse.jaeger 库，
  #   UI 由 jaeger 单进程内置（:16686），支持按 trace_id 精确检索。
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: photography-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-jaeger}   # 启动时自动创建该库（Jaeger 不自己建库）
      # 可选加固：设 CLICKHOUSE_USER/CLICKHOUSE_PASSWORD 后，须同步到 config/jaeger 配置的 auth.basic
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${CLICKHOUSE_PORT:-9000}:9000"          # native 协议（Jaeger 连接用）
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP 接口（调试用）
    volumes:
      - ${CLICKHOUSE_DATA_DIR:-./volume/clickhouse/data}:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend-net

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.18.0}
    container_name: photography-jaeger
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ${JAEGER_CONFIG_FILE:-./volume/jaeger/config.yaml}:/etc/jaeger/config.yaml:ro
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"    # 应用 OTLP gRPC 上报入口
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"    # 应用 OTLP HTTP 上报入口
      - "${JAEGER_UI_PORT:-16686}:16686"         # Jaeger UI
    restart: unless-stopped
    networks:
      - backend-net

  # 后端服务
  backend:
    build:
      context: ${BACKEND_CONTEXT:-./photography-server}
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        # SkyWalking Go agent 注入构建：SW_AGENT_ENABLE=true 时产物内织入 agent，
        # 走 native 通道（直连 OAP:11800）；false 时不注入（Jaeger 通道/纯 OTel 埋点）。
        # 注：native 构建运行期须保持 APP_JAEGER_ENABLE=false，避免 OTel 与 native 双上报。
        SW_AGENT_ENABLE: ${SW_AGENT_ENABLE:-false}
        SW_AGENT_VERSION: ${SW_AGENT_VERSION:-0.7.0}
        SW_AGENT_SERVICE: ${SW_AGENT_SERVICE:-photography-server}
        SW_AGENT_BACKEND: ${SW_AGENT_BACKEND:-skywalking-oap:11800}
    image: chenkangfu/photography-server:${VERSION:-latest}  # 通过环境变量传入版本
    container_name: photography-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      xxl-job-admin:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_started
      # 仅 native 通道需要（OAP 未就绪时 agent 上报会自行重试）；
      # 只跑 Jaeger 通道时可注释掉本项，避免每次 up 都拉起整套 SkyWalking 栈
      skywalking-oap:
        condition: service_started
      # Nacos 是唯一业务配置源（硬依赖）：backend 启动必连，未发布 data_id 会 fail-fast
      nacos:
        condition: service_started
    environment:
      # 【业务配置一律不在容器 env 里】app.mode / jwt.* / db.* / redis.* / nats.* / mongodb.* /
      # log.* / upload.* / xxljob.* / elasticsearch.* / jaeger.* 100% 来自 Nacos：
      # data_id=photography-server-${APP_PROFILE}.yaml（模板见 config/nacos/，未发布则 fail-fast）。
      # 排障时临时加回 APP_* 环境变量即可覆盖（viper env 优先级最高），用完删掉。
      APP_PROFILE: ${APP_PROFILE:-prod}   # 决定拉取哪个 data_id（自举变量，必须保留）
      # 配置密文主密钥（KEK）：解密 Nacos 模板里的 ENCv1: 密文。不能存 Nacos（自举死循环）。
      # 生产更推荐文件方式：把密钥写入 secrets/config_secret（已 gitignore），
      # 再挂 secrets 并改设 APP_CONFIG_SECRET_FILE: /run/secrets/config_secret
      APP_CONFIG_SECRET: ${APP_CONFIG_SECRET:-}
      APP_CONFIG_SECRET_PREV: ${APP_CONFIG_SECRET_PREV:-}   # 仅密钥轮换期使用（只解密）
      # 以下业务段（xxljob / elasticsearch / mongodb / jaeger）已从 env 摘除，全部由 Nacos 提供，
      # 勿再加回，避免两处配置漂移。
      # 链路追踪两通道（各自独立，勿同开，否则同一请求产双 span/双上报）：
      # 通道① SkyWalking-go（native）：SW_AGENT_ENABLE=true 构建注入 agent 后生效，agent 直连 OAP:11800，
      #   数据进 native 模块（Horizon「原生」模式 + 拓扑/指标分析）；此时 jaeger.enable 须为 false；
      # 通道② OTel→Jaeger（复用 OTel 埋点，不注入 agent）：Nacos 里 jaeger.enable=true 且
      #   endpoint=jaeger:4317，数据落 ClickHouse，Jaeger UI(:16686) 按 trace_id 精确检索。
      #   应急覆盖仍可用 APP_JAEGER_*（对应 config 的 jaeger 段）。
      # Nacos 配置中心 + 注册中心：本地 yaml 只是 bootstrap，业务配置 100% 从 Nacos 拉取（无开关）
      APP_NACOS_SERVER_ADDR: ${APP_NACOS_SERVER_ADDR:-nacos:8848}
      APP_NACOS_NAMESPACE: ${APP_NACOS_NAMESPACE:-}
      APP_NACOS_GROUP: ${APP_NACOS_GROUP:-DEFAULT_GROUP}
      APP_NACOS_DATA_ID: ${APP_NACOS_DATA_ID:-photography-server-${APP_PROFILE:-prod}.yaml}
      APP_NACOS_USERNAME: ${APP_NACOS_USERNAME:-}
      APP_NACOS_PASSWORD: ${APP_NACOS_PASSWORD:-}
      APP_NACOS_SERVICE_NAME: ${APP_NACOS_SERVICE_NAME:-photography-server}
      APP_NACOS_REGISTER_IP: ${APP_NACOS_REGISTER_IP:-} # 注册 IP，留空自动探测（容器内为容器 IP）
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # 本地仅挂 bootstrap（Nacos 连接信息）；业务配置 100% 来自 Nacos（data_id 按 APP_PROFILE 区分）
      - ${BACKEND_CONFIG_FILE:-./photography-server/config/config.yaml}:/app/config/config.yaml:ro
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      # SDK 本地快照持久化：容器重启后即使 Nacos 短暂不可用也可用快照兜底启动
      - ${NACOS_CLIENT_CACHE_DIR:-./volume/nacos-client/cache}:/app/.nacos/cache
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  # ===== Nacos 配置中心 + 注册中心（唯一业务配置源，backend 硬依赖）=====
  # standalone 模式 + 内嵌 Derby 存储，开箱可用；数据卷持久化便于重启后保留配置与本地快照语义一致。
  # v3 控制台为独立端口（容器内 8080，宿主经 NACOS_CONSOLE_PORT 访问）；v2 旧版控制台在 http://localhost:8848/nacos。
  # 客户端 SDK 走 gRPC：9848 = 8848+1000，映射端口必须保持该偏移关系。
  # 业务配置发布：data_id=photography-server-<profile>.yaml，模板见 config/nacos/（未发布则 backend fail-fast）。
  # 鉴权三件套：NACOS_AUTH_ENABLE=true 时 TOKEN / IDENTITY_KEY / IDENTITY_VALUE 缺一即 exit 255
  # （脚本报 "env NACOS_AUTH_IDENTITY_KEY must be set."）。IDENTITY 为服务端间识别头，standalone 也必填；
  # Go 客户端不使用它们，连接只需 APP_NACOS_USERNAME/PASSWORD。
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.2.4}
    container_name: photography-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-false} # 开启后须同步设置 APP_NACOS_USERNAME/PASSWORD
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-}
      - JVM_XMS=${NACOS_JVM_XMS:-256m}
      - JVM_XMX=${NACOS_JVM_XMX:-512m}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${NACOS_PORT:-8848}:8848"      # OpenAPI（v2 控制台也在 8848/nacos）
      - "${NACOS_GRPC_PORT:-9848}:9848" # gRPC（客户端 SDK 实际连接端口）
      - "${NACOS_CONSOLE_PORT:-8850}:8080" # v3 控制台（独立端口，勿用 8080 宿主位——backend 已占）
    restart: unless-stopped
    networks:
      - backend-net

  # 前端服务
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-./photography-frontend}
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
    image: chenkangfu/photography-frontend:${VERSION:-latest}  # 通过环境变量传入版本
    container_name: photography-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge