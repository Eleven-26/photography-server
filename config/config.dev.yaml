# ============================================================
# 开发环境配置（默认）
# 启动：go run ./cmd/server -c config/config.yaml -p dev
# ============================================================

app:
  mode: debug
  port: 8090

jwt:
  secret: dev-secret-1234567890

db:
  host: 127.0.0.1
  port: 3307
  user: root
  password: root
  name: photography
  log_mode: true

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

nats:
  url: nats://127.0.0.1:4222

log:
  level: debug

upload:
  dir: ./uploads
  max_size_mb: 20

xxljob:
  enable: true
  server_addr: http://127.0.0.1:8080/xxl-job-admin
  access_token: ""
  executor_ip: 127.0.0.1
  executor_port: "9999"
  registry_key: photography-server
  log_dir: ./logs/xxl-job
