# ============================================================
# 开发环境配置（默认）
# 启动：go run ./cmd/server -c config/config.yaml -p dev
# ============================================================

app:
  mode: debug
  port: 8080

jwt:
  secret: dev-secret-1234567890

db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  name: photography
  log_mode: true

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

nats:
  url: nats://127.0.0.1:4222

mongodb:
  enable: true
  uri: mongodb://127.0.0.1:27017
  database: photography
  username: ""
  password: ""

log:
  level: debug

upload:
  dir: ./uploads
  max_size_mb: 20

xxljob:
  enable: true
  server_addr: http://127.0.0.1:9100 # xxl-job 地址
  access_token: default_token # 确保已创建容器时的一致
  executor_ip: host.docker.internal # 注册回调的go程序地址，不能用127.0.0.1，这个指向了xxl-job容器本身，go不在该容器内
  executor_port: "9999" # 注册回调的go程序所在主机的端口
  registry_key: photography-server # 注册执行器，需要去 Admin 后台执行器管理的 AppName 收到添加
  log_dir: ./logs/xxl-job

elasticsearch:
  enable: true
  urls:
    - http://127.0.0.1:9200
  username: ""
  password: ""

skywalking:
  enable: true
  endpoint: 127.0.0.1:4317 # otel-collector OTLP gRPC 地址
  service: photography-server
  instance: ""
