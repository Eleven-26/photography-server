# ============================================================
# Nacos 发布模板：data_id=photography-server-prod.yaml group=DEFAULT_GROUP
# 本文件是 Nacos 控制台内容的版本化镜像，修改后需到控制台同步发布（重启生效）。
# 本环境为【全量配置】：业务配置（含敏感项）全部在此，容器不再注入 APP_DB_*/APP_JWT_SECRET 等
# 业务变量（.env 只保留 compose 基础设施变量 + Nacos 连接信息 + 密文主密钥 KEK）。
# 敏感值已用 ENCv1: 密文落地（AES-256-GCM，密钥来自 APP_CONFIG_SECRET[_FILE]，不存 Nacos）。
# 安全基线（config.Load 校验，prod 缺失即启动失败）：jwt.secret / db.host / db.user / db.password
# 不得为空或默认弱值——现在由本文件的密文提供；排障时仍可用 APP_* env 临时覆盖（优先级最高）。
# ============================================================

app:
  mode: release
  port: 8080
  timezone: Asia/Shanghai
  # CORS 可信来源白名单（精确 Origin，含 scheme://host[:port]）——只回显命中项并允许凭据。
  # 生产部署前必须替换为真实前端域名；小程序/App 等无 Origin 的客户端不受影响。
  cors_origins:
    - https://admin.example.com

jwt:
  secret: "ENCv1:ALskJ6HYkWcOtO3TEZPZyFxR9s/m8kIHrnmSPL+q8ErYbV1Bdp4pRbjdgwZz+IZaMZOmOWAcKql57N/+BiyGNXBFcA==" # 密文；原值从 .env 的 APP_JWT_SECRET 迁入
  issuer: photography-server
  expire_hours: 168

db:
  host: mysql # compose 服务名（原 APP_DB_HOST）
  port: 3306
  user: "ENCv1:2gg1A9k9jGhJLMnzvjHUwQoQr1pX6YsL04f+jR1ey7c=" # 密文；原 APP_DB_USER
  password: "ENCv1:k40ieJLybr6jdbRy1+UGYD5uToGPMOSq8zEP5vYLaZc=" # 密文；原 APP_DB_PASSWORD
  name: photography
  charset: utf8mb4
  max_idle_conns: 20
  max_open_conns: 200
  log_mode: false

redis:
  addr: redis:6379 # APP_REDIS_ADDR
  password: "" # APP_REDIS_PASSWORD
  db: 0

nats:
  url: nats://nats:4222 # APP_NATS_URL

mongodb:
  enable: false # APP_MONGODB_ENABLE
  uri: "ENCv1:I/clIPB2p7+HNDTaU4VyQBR7MVQkxwCr8gKXOm8t5u8ZJf9v7tRJFnXnpR8fx/zktw==" # APP_MONGODB_URI
  database: photography # APP_MONGODB_DATABASE
  username: "" # APP_MONGODB_USERNAME
  password: "" # APP_MONGODB_PASSWORD

log:
  level: warn

upload:
  dir: /data/uploads
  max_size_mb: 100

xxljob:
  enable: true # APP_XXLJOB_ENABLE
  server_addr: http://xxl-job-admin:8080 # APP_XXLJOB_SERVER_ADDR（容器内访问监听端口 8080；9100 是宿主映射）
  access_token: "ENCv1:L1XSnxgDuiPxAD0yHqA/KH5jo+cbqY8Jm70ZX9MUvsR1ktaqyH0pXT2oId+B2tmZ/Cy5FNVh" # 密文；原 XXLJOB_ACCESS_TOKEN
  executor_ip: 127.0.0.1 # APP_XXLJOB_EXECUTOR_IP
  executor_port: "9999" # APP_XXLJOB_EXECUTOR_PORT
  registry_key: photography-server # APP_XXLJOB_REGISTRY_KEY
  log_dir: /data/logs/xxl-job

elasticsearch:
  enable: false # APP_ELASTICSEARCH_ENABLE；多地址可用 APP_ELASTICSEARCH_URLS 覆盖（逗号分隔）
  urls:
    - http://elasticsearch:9200
  username: "" # APP_ELASTICSEARCH_USERNAME
  password: "" # APP_ELASTICSEARCH_PASSWORD

# Jaeger 链路通道：默认关；SkyWalking native 注入构建也须保持 false（避免双 span/双上报）
jaeger:
  enable: false # APP_JAEGER_ENABLE
  endpoint: jaeger:4317 # APP_JAEGER_ENDPOINT
  service: photography-server # APP_JAEGER_SERVICE
  instance: "" # APP_JAEGER_INSTANCE
