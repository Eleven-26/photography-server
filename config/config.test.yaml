# ============================================================
# 测试环境配置
# 启动：go run ./cmd/server -c config/config.yaml -p test
# ============================================================

app:
  mode: debug
  port: 8080

jwt:
  secret: test-secret-abcdef-9876543210

db:
  host: test-db
  port: 3306
  user: root
  password: test123456
  name: photography
  log_mode: true

redis:
  addr: test-redis:6379
  password: ""
  db: 0

nats:
  url: nats://test-nats:4222

mongodb:
  enable: true
  uri: mongodb://test-mongo:27017
  database: photography
  username: ""
  password: ""

log:
  level: info

upload:
  dir: /data/uploads
  max_size_mb: 50

xxljob:
  enable: true
  server_addr: http://xxl-job-admin:8080/xxl-job-admin
  access_token: ""
  executor_ip: 127.0.0.1
  executor_port: "9999"
  registry_key: photography-server
  log_dir: /data/logs/xxl-job

elasticsearch:
  enable: true
  urls:
    - http://test-es:9200
  username: ""
  password: ""

skywalking:
  enable: true
  endpoint: test-otel-collector:4317
  service: photography-server
  instance: ""
