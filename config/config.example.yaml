# ============================================================
# 示例配置（复制为 config.yaml 后按需修改）
# 多环境机制：
#   config.yaml         公共基础配置
#   config.dev.yaml     开发环境覆盖（默认）
#   config.test.yaml    测试环境覆盖
#   config.prod.yaml    生产环境覆盖
# 环境选择：-p dev|test|prod 或环境变量 APP_PROFILE
# 优先级：APP_* 环境变量 > 环境配置文件 > config.yaml
# 环境覆盖：设置 APP_* 环境变量即可覆盖同名配置项（如 APP_DB_HOST 覆盖 db.host），无需占位符
# ============================================================

app:
  name: photography-server
  mode: debug
  port: 8080
  timezone: Asia/Shanghai

jwt:
  secret: please-set-a-strong-secret
  issuer: photography-server
  expire_hours: 168

db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  name: photography
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  log_mode: false

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

nats:
  url: nats://127.0.0.1:4222

mongodb:
  enable: true
  uri: mongodb://127.0.0.1:27017
  database: photography
  username: ""
  password: ""

log:
  level: info

upload:
  dir: ./uploads
  max_size_mb: 20

xxljob:
  enable: true
  server_addr: http://127.0.0.1:8080/xxl-job-admin
  access_token: ""
  executor_ip: 127.0.0.1
  executor_port: "9999"
  registry_key: photography-server
  log_dir: ./logs/xxl-job

elasticsearch:
  enable: true
  urls:
    - http://127.0.0.1:9200
  username: ""
  password: ""

# SkyWalking 链路追踪方案（OTel SDK 经 OTLP 上报 otel-collector，由其转发 SkyWalking OAP；
# collector/OAP 不可达时仅后台重试，不影响服务）
skywalking:
  enable: true
  endpoint: 127.0.0.1:4317 # otel-collector OTLP gRPC 地址
  service: photography-server
  instance: "" # 留空默认取主机名
