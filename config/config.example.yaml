# ============================================================
# Bootstrap 配置模板（复制为 config.yaml 后按需修改）
# Nacos 是唯一业务配置源：本地只保留 bootstrap（本文件内容，仅 nacos 连接段），
# 业务配置在 Nacos 控制台按 data_id 发布，版本化模板见 config/nacos/photography-server-*.yaml。
#
# 多环境机制（本地 profile 配置文件已废弃）：
#   环境由 -p dev|test|prod 或 APP_PROFILE 决定，仅影响 data_id 中的 ${profile} 占位；
#   环境差异全部体现在 Nacos 上不同的 data_id（photography-server-<profile>.yaml）。
# 优先级：APP_* 环境变量 > Nacos 远程配置 > 本地 bootstrap
# 变量命名规则：APP_ + 段名_键名（如 db.host→APP_DB_HOST、mongodb.*→APP_MONGODB_*、
#   redis.addr→APP_REDIS_ADDR、app.mode→APP_APP_MODE；回归测试见 internal/config/env_mapping_test.go）
# 启动顺序：先起 Nacos 并发布对应 data_id，再启动本服务（拉取失败即 fail-fast）。
# ============================================================

nacos:
  server_addr: 127.0.0.1:8848 # 容器内互联用服务名（如 nacos:8848 / nacos-dev:8848），可用 APP_NACOS_SERVER_ADDR 覆盖
  namespace: "" # 留空 = public
  group: DEFAULT_GROUP
  data_id: photography-server-${profile}.yaml # ${profile} 自动替换为 dev/test/prod
  username: "" # 服务端开启鉴权（NACOS_AUTH_ENABLE=true）时必填
  password: ""
  service_name: photography-server # 注册到 Nacos 的服务名
  register_ip: "" # 留空自动探测（容器内为容器 IP）
  timeout_ms: 5000 # 请求超时（APP_NACOS_TIMEOUT_MS 可覆盖）
  cache_dir: .nacos/cache # 本地快照目录（Nacos 短暂不可用时的启动兜底）
  log_level: warn # SDK 自身日志级别
  cluster_name: DEFAULT # 集群名
  weight: 1 # 注册权重
