# OpenTelemetry Collector（0.157.0）
# 职责：接收应用侧 OTLP 上报，转发给 SkyWalking OAP（OTLP receiver 与 agent gRPC 共享 11800 端口）
# 数据流：应用 --OTLP:4317 --> 本服务 --OTLP:11800 --> skywalking-oap --> banyandb

# -------目前docker-compose使用，后面得修改

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # 显式绑定所有网卡（新版默认仅 localhost，容器内必须放开）
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp:
    endpoint: skywalking-oap:11800
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp]
    # 如需指标/日志同样入库 SkyWalking，按需开启：
    # metrics:
    #   receivers: [otlp]
    #   exporters: [otlp]
    # logs:
    #   receivers: [otlp]
    #   exporters: [otlp]
