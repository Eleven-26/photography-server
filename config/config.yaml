# ============================================================
# Bootstrap 配置（本地唯一保留的配置文件）
# Nacos 是唯一业务配置源：本文件只提供 Nacos 连接信息，
# 业务配置在 Nacos 控制台按 data_id 管理（发布模板见 config/nacos/）。
#
# 启动顺序：先起 Nacos 并发布对应 data_id，再启动本服务（拉取失败即终止，fail-fast；
# Nacos 整体不可达时 SDK 自动降级读本地快照 .nacos/cache）。
# 环境：启动参数 -p dev|test|prod 或环境变量 APP_PROFILE，决定 data_id 中的 ${profile}。
# 连接信息可用 APP_NACOS_* 环境变量覆盖（如 APP_NACOS_SERVER_ADDR，docker.dev 等场景用）。
# 业务配置变更需重启生效（无热更）。
# ============================================================

nacos:
  server_addr: 127.0.0.1:8848 # v2 SDK 走 gRPC，端口自动 +1000（9848）
  namespace: "" # 留空 = public
  group: DEFAULT_GROUP
  data_id: photography-server-${profile}.yaml # ${profile} 自动替换为 dev/test/prod
  # 开启鉴权（NACOS_AUTH_ENABLE=true）时必填，留空会导致拉取配置 401 "User not found"。
  # 生产由 docker compose 从 .env 注入 APP_NACOS_USERNAME/PASSWORD；
  # 本地运行用 `make run-dev`（自动 source .env）。
  # goland启动的配置：Environmengts
  username: ""
  password: ""
  service_name: photography-server # 注册到 Nacos 的服务名
  register_ip: "" # 留空自动探测本机 IP
  timeout_ms: 5000 # 请求超时（APP_NACOS_TIMEOUT_MS 可覆盖）
  cache_dir: .nacos/cache # 本地快照目录（Nacos 短暂不可用时的启动兜底）
  log_level: warn # SDK 自身日志级别
  cluster_name: DEFAULT # 集群名
  weight: 1 # 注册权重
