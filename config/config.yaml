# 公共基础配置（dev/test/prod 共用的默认值）
# 环境差异通过 config.dev.yaml / config.test.yaml / config.prod.yaml 覆盖
# 选择环境：启动参数 -p dev|test|prod 或环境变量 APP_PROFILE，默认 dev

app:
  name: photography-server
  mode: debug
  port: 8080
  timezone: Asia/Shanghai

jwt:
  secret: photography-server-jwt-secret-change-me
  issuer: photography-server
  expire_hours: 168

db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  name: photography
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  log_mode: false

log:
  level: info

upload:
  dir: ./uploads
  max_size_mb: 20
