# ============================================================
# 生产环境配置（安全基线）
# 启动：go run ./cmd/server -c config/config.yaml -p prod
# 注意：生产密钥/数据库密码请通过环境变量注入（APP_JWT_SECRET 等），
#       勿将真实密钥提交到仓库。
# ============================================================

app:
  mode: release
  port: 8080

jwt:
  secret: ${APP_JWT_SECRET}
  issuer: photography-server
  expire_hours: 168

db:
  host: ${APP_DB_HOST}
  port: 3306
  user: ${APP_DB_USER}
  password: ${APP_DB_PASSWORD}
  name: photography
  charset: utf8mb4
  max_idle_conns: 20
  max_open_conns: 200
  log_mode: false

redis:
  addr: ${APP_REDIS_ADDR:-redis:6379}
  password: ${APP_REDIS_PASSWORD:-}
  db: 0

nats:
  url: ${APP_NATS_URL:-nats://nats:4222}

mongodb:
  enable: ${APP_MONGO_ENABLE:-false}
  uri: ${APP_MONGO_URI:-mongodb://mongo:27017}
  database: ${APP_MONGO_DATABASE:-photography}
  username: ${APP_MONGO_USERNAME:-}
  password: ${APP_MONGO_PASSWORD:-}

log:
  level: warn

upload:
  dir: /data/uploads
  max_size_mb: 100

xxljob:
  enable: ${APP_XXLJOB_ENABLE:-false}
  server_addr: ${APP_XXLJOB_SERVER_ADDR:-http://xxl-job-admin:8080/xxl-job-admin}
  access_token: ${APP_XXLJOB_ACCESS_TOKEN:-}
  executor_ip: ${APP_XXLJOB_EXECUTOR_IP:-127.0.0.1}
  executor_port: ${APP_XXLJOB_EXECUTOR_PORT:-"9999"}
  registry_key: ${APP_XXLJOB_REGISTRY_KEY:-photography-server}
  log_dir: ${APP_XXLJOB_LOG_DIR:-/data/logs/xxl-job}

elasticsearch:
  enable: ${APP_ES_ENABLE:-false}
  urls:
    - ${APP_ES_URL:-http://elasticsearch:9200}
  username: ${APP_ES_USERNAME:-}
  password: ${APP_ES_PASSWORD:-}

skywalking:
  enable: ${APP_SKYWALKING_ENABLE:-false}
  oap_addr: ${APP_SKYWALKING_OAP_ADDR:-skywalking-oap:11800}
  service: ${APP_SKYWALKING_SERVICE:-photography-server}
  instance: ${APP_SKYWALKING_INSTANCE:-}
