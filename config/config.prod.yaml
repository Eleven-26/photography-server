# ============================================================
# 生产环境配置（安全基线）
# 启动：go run ./cmd/server -c config/config.yaml -p prod
# 环境覆盖：APP_* 环境变量优先于本文件（如 APP_DB_HOST 覆盖 db.host）
# 必须注入（缺失时启动即失败，由 config.Load 校验）：
#   APP_JWT_SECRET / APP_DB_HOST / APP_DB_USER / APP_DB_PASSWORD
# 其余项未注入时使用下方默认值；勿将真实密钥提交到仓库。
# ============================================================

app:
  mode: release
  port: 8080

jwt:
  secret: "" # 必须通过 APP_JWT_SECRET 注入
  issuer: photography-server
  expire_hours: 168

db:
  host: "" # 必须通过 APP_DB_HOST 注入
  port: 3306
  user: "" # 必须通过 APP_DB_USER 注入
  password: "" # 必须通过 APP_DB_PASSWORD 注入
  name: photography
  charset: utf8mb4
  max_idle_conns: 20
  max_open_conns: 200
  log_mode: false

redis:
  addr: redis:6379 # APP_REDIS_ADDR
  password: "" # APP_REDIS_PASSWORD
  db: 0

nats:
  url: nats://nats:4222 # APP_NATS_URL

mongodb:
  enable: false # APP_MONGO_ENABLE
  uri: mongodb://mongo:27017 # APP_MONGO_URI
  database: photography # APP_MONGO_DATABASE
  username: "" # APP_MONGO_USERNAME
  password: "" # APP_MONGO_PASSWORD

log:
  level: warn

upload:
  dir: /data/uploads
  max_size_mb: 100

xxljob:
  enable: true # APP_XXLJOB_ENABLE
  server_addr: http://xxl-job-admin:9100 # APP_XXLJOB_SERVER_ADDR
  access_token: "" # APP_XXLJOB_ACCESS_TOKEN
  executor_ip: 127.0.0.1 # APP_XXLJOB_EXECUTOR_IP
  executor_port: "9999" # APP_XXLJOB_EXECUTOR_PORT
  registry_key: photography-server # APP_XXLJOB_REGISTRY_KEY
  log_dir: /data/logs/xxl-job

elasticsearch:
  enable: false # APP_ES_ENABLE；多地址可用 APP_ELASTICSEARCH_URLS 覆盖（逗号分隔）
  urls:
    - http://elasticsearch:9200
  username: "" # APP_ES_USERNAME
  password: "" # APP_ES_PASSWORD

skywalking:
  enable: false # APP_SKYWALKING_ENABLE
  oap_addr: skywalking-oap:11800 # APP_SKYWALKING_OAP_ADDR
  service: photography-server # APP_SKYWALKING_SERVICE
  instance: "" # APP_SKYWALKING_INSTANCE，留空默认取主机名
