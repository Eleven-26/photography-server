    function validateForm(form){let ok=true;form.querySelectorAll('.form-field').forEach(w=>w.classList.remove('invalid'));form.querySelectorAll('.field-error').forEach(e=>e.textContent='');form.querySelectorAll('input,select,textarea').forEach(el=>{let msg='';const v=el.value.trim();if(el.dataset.required==='true'&&!v)msg='此项不能为空';if(!msg&&el.dataset.type==='phone'&&!/^1\d{10}$/.test(v))msg='请输入 11 位中国大陆手机号';if(!msg&&el.dataset.type==='money'&&(!/^\d+(\.\d{1,2})?$/.test(v)||Number(v)<0))msg='请输入有效金额';if(!msg&&el.type==='date'&&!v)msg='请选择日期';if(!msg&&el.type==='number'&&v!==''&&Number(v)<Number(el.min||0))msg=`不能小于 ${el.min||0}`;if(msg){ok=false;el.closest('.form-field')?.classList.add('invalid');const er=form.querySelector(`[data-error-for="${el.name}"]`);if(er)er.textContent=msg}});const start=form.querySelector('[name="startTime"]'),end=form.querySelector('[name="endTime"]');if(start&&end&&start.value&&end.value&&end.value<=start.value){ok=false;end.closest('.form-field')?.classList.add('invalid');form.querySelector('[data-error-for="endTime"]').textContent='结束时间必须晚于开始时间'}return ok}

    function orderMatchesFilter(o){if(UI.orderOwner!=='全部'&&o.owner!==UI.orderOwner)return false;const total=orderFinancial(o).total;if(UI.orderAmount==='0-1000'&&total>1000)return false;if(UI.orderAmount==='1000-3000'&&(total<1000||total>3000))return false;if(UI.orderAmount==='3000以上'&&total<3000)return false;const refund=refundRecord(o.orderId);if(UI.orderFilter==='退款中')return !!refund&&['待审核','待退款','退款处理中'].includes(refund.status);if(UI.orderFilter==='全部')return true;if(UI.orderFilter==='待处理')return ['待核验','待支付'].includes(o.paymentStatus)||['待客户回复','待定金'].includes(o.status);if(UI.orderFilter==='拍摄中')return ['待拍摄','拍摄中'].includes(o.status);if(UI.orderFilter==='交付中')return ['精修中','待交付'].includes(o.status);if(UI.orderFilter==='已完成')return o.status==='已完成';return true}
    function renderOrders(){const q=UI.orderQuery.toLowerCase();const list=APP_DATA.orders.filter(orderMatchesFilter).filter(o=>{const c=customer(o.customerId),p=pkg(o.packageId);return [o.orderId,c.name,c.phone,c.phoneMasked,o.service,p?.name,o.location].join(' ').toLowerCase().includes(q)});const pending=APP_DATA.orders.filter(o=>o.paymentStatus==='待核验'||o.status==='待客户回复').length,verified=APP_DATA.orders.reduce((n,o)=>n+o.verifiedReceived,0),remaining=APP_DATA.orders.reduce((n,o)=>n+orderFinancial(o).outstanding,0);return `<div class="page-wrap"><div class="page-head"><div><h1>订单管理</h1><p>订单、客户、金额、日历和财务均来自同一份 APP_DATA。</p></div><div class="page-actions"><button class="ghost-btn" data-action="export" data-kind="orders">${icon('download')}导出订单</button><button class="primary-btn" data-action="open-modal" data-kind="order">${icon('plus')}录入订单</button></div></div><div class="stats"><div class="card stat-card"><div class="stat-top"><span>全部订单</span><div class="stat-icon">${icon('order')}</div></div><div class="stat-value">${APP_DATA.orders.length}</div><div class="stat-foot">当前筛选 ${list.length} 笔</div></div><div class="card stat-card mint"><div class="stat-top"><span>待处理</span><div class="stat-icon">${icon('warning')}</div></div><div class="stat-value">${pending}</div><div class="stat-foot">包含收款核验和客户回复</div></div><div class="card stat-card lav"><div class="stat-top"><span>已确认到账</span><div class="stat-icon">${icon('wallet')}</div></div><div class="stat-value">${money(verified)}</div><div class="stat-foot">原型订单汇总</div></div><div class="card stat-card yellow"><div class="stat-top"><span>订单剩余应收</span><div class="stat-icon">${icon('clock')}</div></div><div class="stat-value">${money(remaining)}</div><div class="stat-foot">待核验金额仍计入剩余应收</div></div></div><div class="section-title"><h2>订单列表</h2><span>显示 ${list.length} / ${APP_DATA.orders.length} 笔</span></div><div class="toolbar"><label class="field">${icon('search')}<input data-page-search="orders" value="${esc(UI.orderQuery)}" placeholder="搜索客户、手机号、订单号或套餐"></label>${['全部','待处理','拍摄中','交付中','已完成'].map(x=>`<button class="filter-chip ${UI.orderFilter===x?'active':''}" data-filter="orders" data-value="${x}">${x}</button>`).join('')}<div class="toolbar-spacer"></div><button class="ghost-btn" data-action="open-modal" data-kind="order-filter">${icon('filter')}更多筛选</button><div class="view-toggle"><button class="${UI.orderMode==='table'?'active':''}" data-mode="orders" data-value="table" aria-label="列表视图">${icon('order')}</button><button class="${UI.orderMode==='cards'?'active':''}" data-mode="orders" data-value="cards" aria-label="卡片视图">${icon('grid')}</button></div></div>${list.length?UI.orderMode==='table'?`<div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>客户 / 来源</th><th>服务内容</th><th>拍摄时间</th><th>订单总额</th><th>状态</th><th>负责人</th><th></th></tr></thead><tbody>${list.map((o,i)=>orderRow(o,i)).join('')}</tbody></table></div></div>`:`<div class="order-cards">${list.map(o=>{const c=customer(o.customerId),f=orderFinancial(o);return `<div class="card order-card" data-open="order" data-id="${o.orderId}"><div class="order-card-top"><div><h3>${esc(c.name)} · ${esc(o.service)}</h3><p>${o.orderId}</p></div>${status(o.status,toneFor(o.status))}</div><div class="order-card-grid"><div><span>拍摄时间</span><strong>${formatDateTime(o.shootAt)}</strong></div><div><span>订单总额</span><strong>${money(f.total)}</strong></div><div><span>地点</span><strong>${esc(o.location)}</strong></div><div><span>负责人</span><strong>${esc(o.owner)}</strong></div></div></div>`}).join('')}</div>`:`<div class="card empty-state">${icon('search')}<strong>没有符合条件的订单</strong><p>清除搜索或切换筛选条件后重试。</p></div>`}</div>`}

    function leadCard(l){const quote=l.quotes.at(-1);return `<div class="lead-card" data-open="lead" data-id="${l.leadId}"><div class="lead-top"><strong>${esc(l.name)}</strong><span class="mini-tag ${toneFor(l.status)}">${esc(l.status)}</span></div><div class="lead-channel">${esc(l.service)} · ${esc(l.channel)} · ${formatDateTime(l.createdAt)}</div><div class="lead-msg">${esc(l.message)}</div><div class="lead-foot"><span>${quote?`最新报价 ${money(quote.amount)} · V${quote.version}`:esc(l.budget)}</span>${icon('chevron')}</div></div>`}
    function renderLeads(){const q=UI.leadQuery.toLowerCase(),list=APP_DATA.leads.filter(l=>UI.leadFilter==='全部'||l.status===UI.leadFilter).filter(l=>[l.name,l.service,l.channel,l.message,l.brief,l.budget].join(' ').toLowerCase().includes(q));const statuses=['待回复','待报价','已报价','待确认'];return `<div class="page-wrap"><div class="page-head"><div><h1>线索与报价</h1><p>从客户咨询到报价发送，状态和报价版本真实联动。</p></div><div class="page-actions"><button class="ghost-btn" data-action="copy-link" data-kind="booking">${icon('link')}分享预约入口</button><button class="primary-btn" data-action="open-modal" data-kind="lead">${icon('plus')}新建线索</button></div></div><div class="page-note">${icon('spark')} 点击任意线索可查看对应 AI Brief、沟通记录和报价历史。</div><div class="toolbar"><div class="view-toggle"><button class="${UI.leadMode==='board'?'active':''}" data-mode="leads" data-value="board">看板</button><button class="${UI.leadMode==='list'?'active':''}" data-mode="leads" data-value="list">列表</button></div>${['全部',...statuses].map(x=>`<button class="filter-chip ${UI.leadFilter===x?'active':''}" data-filter="leads" data-value="${x}">${x} ${x==='全部'?APP_DATA.leads.length:APP_DATA.leads.filter(l=>l.status===x).length}</button>`).join('')}<div class="toolbar-spacer"></div><label class="field">${icon('search')}<input data-page-search="leads" value="${esc(UI.leadQuery)}" placeholder="搜索客户、服务或需求"></label></div>${list.length?UI.leadMode==='board'?`<div class="pipeline">${statuses.map(st=>`<div class="lane"><div class="lane-head"><strong>${st}</strong><span>${list.filter(l=>l.status===st).length}</span></div>${list.filter(l=>l.status===st).map(leadCard).join('')||`<div class="empty-state" style="padding:28px 10px"><strong>暂无${st}</strong></div>`}</div>`).join('')}</div>`:`<div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>客户</th><th>服务</th><th>需求</th><th>预算 / 报价</th><th>状态</th><th></th></tr></thead><tbody>${list.map((l,i)=>`<tr data-open="lead" data-id="${l.leadId}"><td><div class="person">${avatar(l.name,i%2?'mint':'lav')}<div class="person-meta"><strong>${esc(l.name)}</strong><span>${esc(l.channel)}</span></div></div></td><td>${esc(l.service)}</td><td style="max-width:320px;white-space:normal">${esc(l.message)}</td><td>${l.quotes.length?money(l.quotes.at(-1).amount):esc(l.budget)}</td><td>${status(l.status,toneFor(l.status))}</td><td>${icon('chevron')}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="card empty-state">${icon('search')}<strong>没有符合条件的线索</strong><p>清除搜索或切换状态后重试。</p></div>`}</div>`}

    function weekDates(){const d=new Date(`${APP_DATA.meta.weekStart}T00:00:00`);d.setDate(d.getDate()+UI.calendarOffset*7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
    function eventsForDate(date){const key=formatDate(date);const orderEvents=APP_DATA.orders.filter(o=>formatDate(o.shootAt)===key).map(o=>({type:'order',time:o.shootAt.slice(11,16),label:`${o.service} · ${customer(o.customerId).name}`,orderId:o.orderId,special:date.getDay()===1}));const blocks=APP_DATA.calendarBlocks.filter(b=>b.date===key).map(b=>({type:b.type,time:b.start,label:b.label,orderId:b.orderId}));return [...orderEvents,...blocks].sort((a,b)=>a.time.localeCompare(b.time))}
    function renderWeekCalendar(dates){const names=['周一','周二','周三','周四','周五','周六','周日'],slots=['09:00','09:30','10:00','12:30','14:00','15:30','16:00'];return `<div style="overflow:auto"><div class="calendar-grid"><div class="cal-cell cal-head"></div>${dates.map((d,i)=>`<div class="cal-cell cal-head ${formatDate(d)===APP_DATA.meta.demoDate?'today':''}">${names[i]}<strong>${d.getMonth()+1}/${d.getDate()}</strong></div>`).join('')}${slots.map(time=>`<div class="cal-cell cal-time">${time}</div>${dates.map(d=>{const ev=eventsForDate(d).filter(e=>e.time===time),monday=d.getDay()===1;return `<div class="cal-cell">${ev.length?ev.map(e=>`<div class="cal-event ${e.type==='closed'||e.type==='special'||e.special?'lav':''}" ${e.orderId?`data-open="order" data-id="${e.orderId}"`:''}><strong>${esc(e.label)}</strong><span>${e.special||e.type==='special'?'特殊安排 · ':e.type==='closed'?'关闭时间 · ':'已预约 · '}${e.time}</span></div>`).join(''):monday?`<div class="cal-event lav"><strong>非接单日</strong><span>关闭 · 周一</span></div>`:`<div class="cal-open" data-action="open-modal" data-kind="block" data-date="${formatDate(d)}" data-time="${time}">工作时间 · 可约 ${time}</div>`}</div>`}).join('')}`).join('')}</div></div>`}
    function renderMonthCalendar(monthDate){const year=monthDate.getFullYear(),month=monthDate.getMonth(),first=new Date(year,month,1),start=(first.getDay()+6)%7,cells=[],days=new Date(year,month+1,0).getDate();for(let i=0;i<start;i++)cells.push(null);for(let day=1;day<=days;day++)cells.push(new Date(year,month,day));return `<div style="overflow:auto"><div class="calendar-month">${cells.map(d=>d?`<div class="month-day ${formatDate(d)===APP_DATA.meta.demoDate?'today':''}"><strong>${d.getDate()}</strong>${eventsForDate(d).map(e=>`<div class="month-event ${e.type==='closed'||e.type==='special'||e.special?'closed':''}" ${e.orderId?`data-open="order" data-id="${e.orderId}"`:''}>${esc(e.label)} · ${e.time}${e.special||e.type==='special'?' · 特殊安排':''}</div>`).join('')}</div>`:`<div class="month-day"></div>`).join('')}</div></div>`}
    function renderResourceCalendar(dates){const names=dates.map(d=>`${d.getMonth()+1}/${d.getDate()}`);const rows=[{name:'路先生 · 摄影师',value:d=>eventsForDate(d).some(e=>e.type==='order')?'已预约':'可约',kind:d=>eventsForDate(d).some(e=>e.type==='order')?'booked':'open'},{name:'天河工作室 · 场地',value:d=>eventsForDate(d).some(e=>e.label.includes('天河工作室'))?'已占用':'可用',kind:d=>eventsForDate(d).some(e=>e.label.includes('天河工作室'))?'booked':'open'},{name:'A7M4 双机位 · 设备',value:d=>formatDate(d)==='2026-08-10'?'婚礼占用':'可用',kind:d=>formatDate(d)==='2026-08-10'?'closed':'open'}];return `<div style="overflow:auto"><div class="resource-grid"><div class="resource-cell head">资源</div>${names.map(n=>`<div class="resource-cell head">${n}</div>`).join('')}${rows.map(r=>`<div class="resource-cell head">${r.name}</div>${dates.map(d=>`<div class="resource-cell"><div class="resource-${r.kind(d)}">${r.value(d)}</div></div>`).join('')}`).join('')}</div></div>`}
    function renderCalendar(){const dates=weekDates(),monthDate=new Date('2026-08-01T00:00:00');monthDate.setMonth(monthDate.getMonth()+UI.calendarOffset);const range=`${dates[0].getFullYear()} 年 ${dates[0].getMonth()+1} 月 ${dates[0].getDate()} 日 — ${dates[6].getMonth()+1} 月 ${dates[6].getDate()} 日`,title=UI.calendarView==='month'?`${monthDate.getFullYear()} 年 ${monthDate.getMonth()+1} 月`:range;return `<div class="page-wrap"><div class="page-head"><div><h1>日程与档期</h1><p>工作时间、可约时间、特殊安排、已预约和关闭时间分别显示。</p></div><div class="page-actions"><button class="ghost-btn" data-action="preview-customer">${icon('link')}预览客户预约页</button><button class="primary-btn" data-action="open-modal" data-kind="block">${icon('plus')}关闭时段</button></div></div><div class="card card-pad"><div class="calendar-top"><div><div class="calendar-title">${title}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${APP_DATA.workspace.name} · ${APP_DATA.meta.city} · 周一默认不开放接单</div></div><div class="page-actions"><button class="ghost-btn" data-calendar-nav="prev">${icon('chevron')}上一周期</button><button class="ghost-btn" data-calendar-nav="today">今天</button><button class="ghost-btn" data-calendar-nav="next">下一周期 ${icon('chevron')}</button></div></div><div class="toolbar">${[['week','周视图'],['month','月视图'],['resource','资源视图']].map(x=>`<button class="filter-chip ${UI.calendarView===x[0]?'active':''}" data-calendar-view="${x[0]}">${x[1]}</button>`).join('')}<div class="toolbar-spacer"></div><span style="font-size:11px;color:var(--muted)">橙色：已预约　绿色：工作时间 / 可约　紫色：关闭 / 特殊安排</span></div>${UI.calendarView==='week'?renderWeekCalendar(dates):UI.calendarView==='month'?renderMonthCalendar(monthDate):renderResourceCalendar(dates)}</div><div class="section-title"><h2>档期规则</h2><span>原型状态与客户预约预览同步</span></div><div class="stats"><div class="card stat-card"><div class="stat-top"><span>常规接单时间</span><div class="stat-icon">${icon('clock')}</div></div><div class="stat-value" style="font-size:20px">周二—周日</div><div class="stat-foot">09:00—18:00 · 拍摄后缓冲 30 分钟</div></div><div class="card stat-card mint"><div class="stat-top"><span>当前周订单</span><div class="stat-icon">${icon('calendar')}</div></div><div class="stat-value">${dates.reduce((n,d)=>n+APP_DATA.orders.filter(o=>formatDate(o.shootAt)===formatDate(d)).length,0)}</div><div class="stat-foot">周一预约会明确标记为特殊安排</div></div><div class="card stat-card lav"><div class="stat-top"><span>关闭时段</span><div class="stat-icon">${icon('warning')}</div></div><div class="stat-value">${APP_DATA.calendarBlocks.filter(b=>b.type==='closed').length}</div><div class="stat-foot">明确区别于普通可约时间</div></div><div class="card stat-card yellow"><div class="stat-top"><span>资源冲突</span><div class="stat-icon">${icon('spark')}</div></div><div class="stat-value">0</div><div class="stat-foot"><span class="up">当前无冲突</span></div></div></div></div>`}

    function customerMatches(c){if(UI.customerTag!=='全部'&&!c.tags.includes(UI.customerTag))return false;if(UI.customerFilter==='最近合作')return c.lastCooperation>='2026-08-01';if(UI.customerFilter==='高价值')return c.highValue;if(UI.customerFilter==='待跟进')return c.needsFollowUp;return true}
    function renderCustomers(){const q=UI.customerQuery.toLowerCase(),list=APP_DATA.customers.filter(customerMatches).filter(c=>[c.customerId,c.name,c.phone,c.phoneMasked,c.type,c.source,c.tags.join(' '),c.notes].join(' ').toLowerCase().includes(q));return `<div class="page-wrap"><div class="page-head"><div><h1>客户管理</h1><p>客户档案、订单和已结算金额从同一份数据聚合。</p></div><div class="page-actions"><button class="ghost-btn" data-action="export" data-kind="customers">${icon('download')}导出客户</button><button class="primary-btn" data-action="open-modal" data-kind="customer">${icon('plus')}添加客户</button></div></div><div class="stats"><div class="card stat-card"><div class="stat-top"><span>客户总数</span><div class="stat-icon">${icon('users')}</div></div><div class="stat-value">${APP_DATA.customers.length}</div><div class="stat-foot">当前筛选 ${list.length} 位</div></div><div class="card stat-card mint"><div class="stat-top"><span>待跟进</span><div class="stat-icon">${icon('chat')}</div></div><div class="stat-value">${APP_DATA.customers.filter(c=>c.needsFollowUp).length}</div><div class="stat-foot">与线索状态联动</div></div><div class="card stat-card lav"><div class="stat-top"><span>高价值客户</span><div class="stat-icon">${icon('spark')}</div></div><div class="stat-value">${APP_DATA.customers.filter(c=>c.highValue).length}</div><div class="stat-foot">企业与高客单客户</div></div><div class="card stat-card yellow"><div class="stat-top"><span>已确认到账</span><div class="stat-icon">${icon('wallet')}</div></div><div class="stat-value">${money(APP_DATA.orders.reduce((n,o)=>n+o.verifiedReceived,0))}</div><div class="stat-foot">不是订单总额</div></div></div><div class="section-title"><h2>客户档案</h2><span>显示 ${list.length} / ${APP_DATA.customers.length} 位</span></div><div class="toolbar"><label class="field">${icon('search')}<input data-page-search="customers" value="${esc(UI.customerQuery)}" placeholder="搜索姓名、手机号或标签"></label>${['全部','最近合作','高价值','待跟进'].map(x=>`<button class="filter-chip ${UI.customerFilter===x?'active':''}" data-filter="customers" data-value="${x}">${x}</button>`).join('')}<div class="toolbar-spacer"></div><button class="ghost-btn" data-action="open-modal" data-kind="tag-filter">${icon('filter')}标签筛选</button></div>${list.length?`<div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>客户</th><th>最近服务</th><th>订单数</th><th>已确认到账</th><th>来源</th><th>标签</th><th></th></tr></thead><tbody>${list.map((c,i)=>{const orders=APP_DATA.orders.filter(o=>o.customerId===c.customerId),last=orders[0];return `<tr data-open="customer" data-id="${c.customerId}"><td><div class="person">${avatar(c.name,i%2?'mint':'lav')}<div class="person-meta"><strong>${esc(c.name)}</strong><span>${esc(c.type)} · ${esc(c.phoneMasked)}</span></div></div></td><td>${last?esc(last.service):'暂无订单'}<span class="person-meta"><span>${last?`${formatDateTime(last.shootAt)} · ${last.status}`:'—'}</span></span></td><td>${orders.length}</td><td class="amount">${money(settledForCustomer(c.customerId))}</td><td>${esc(c.source)}</td><td><span class="pill ${c.highValue?'lav':''}">${esc(c.tags.slice(0,2).join(' · '))}</span></td><td>${icon('chevron')}</td></tr>`}).join('')}</tbody></table></div></div>`:`<div class="card empty-state">${icon('search')}<strong>没有符合条件的客户</strong><p>清除搜索或切换筛选条件后重试。</p></div>`}</div>`}

    const deliveryStages=['待上传样片','客户选片中','精修进行中','待确认交付'];
    function renderDelivery(){return `<div class="page-wrap"><div class="page-head"><div><h1>选片与精修</h1><p>创建任务后会进入对应阶段，并与订单、客户、负责人保持一致。</p></div><div class="page-actions"><button class="ghost-btn" data-action="prototype" data-message="批量上传将在开发版接入对象存储">${icon('download')}批量上传</button><button class="primary-btn" data-action="open-modal" data-kind="delivery">${icon('plus')}新建交付任务</button></div></div><div class="stats">${deliveryStages.map((st,i)=>`<div class="card stat-card ${['','mint','lav','yellow'][i]}"><div class="stat-top"><span>${st}</span><div class="stat-icon">${icon(i===0?'image':i===1?'check':i===2?'spark':'wallet')}</div></div><div class="stat-value">${APP_DATA.deliveries.filter(d=>d.stage===st).length}</div><div class="stat-foot">数据来自交付任务列表</div></div>`).join('')}</div><div class="section-title"><h2>交付工作流</h2><span>点击任务查看对应客户、订单和进度</span></div><div class="delivery-board">${deliveryStages.map(st=>`<div class="delivery-lane"><div class="lane-head"><strong>${st}</strong><span>${APP_DATA.deliveries.filter(d=>d.stage===st).length}</span></div>${APP_DATA.deliveries.filter(d=>d.stage===st).map(d=>{const c=customer(d.customerId),o=order(d.orderId);return `<div class="delivery-task" data-open="delivery" data-id="${d.deliveryId}"><h4>${esc(c.name)} · ${esc(o?.service||d.type)}</h4><p>${esc(d.type)} · ${d.rawCount} 张原片 · ${d.retouchCount} 张精修</p><div class="progress"><i class="${d.progress===100?'mint':''}" style="width:${d.progress}%"></i></div><div class="task-foot"><span>${esc(d.owner)} · ${d.progress}%</span><span>${formatDateTime(d.dueAt)} 截止</span></div></div>`}).join('')||`<div class="empty-state" style="padding:26px 8px"><strong>暂无任务</strong></div>`}</div>`).join('')}</div></div>`}

    function renderPackages(){const list=APP_DATA.packages.filter(p=>UI.packageFilter==='全部'||p.status===UI.packageFilter).filter(p=>UI.packageCategory==='全部'||p.category===UI.packageCategory);const cats=['全部',...new Set(APP_DATA.packages.map(p=>p.category))];return `<div class="page-wrap"><div class="page-head"><div><h1>套餐管理</h1><p>套餐与作品集保持独立，历史订单保存下单时的金额快照。</p></div><div class="page-actions"><button class="ghost-btn" data-action="preview-customer">${icon('link')}预览客户页</button><button class="primary-btn" data-action="open-modal" data-kind="package">${icon('plus')}新建套餐</button></div></div><div class="page-note">${icon('spark')} 已被订单引用的套餐修改价格时会生成新版本，不会覆盖历史订单。</div><div class="toolbar">${['全部','已上架','草稿','已下线'].map(x=>`<button class="filter-chip ${UI.packageFilter===x?'active':''}" data-filter="packages" data-value="${x}">${x} ${x==='全部'?APP_DATA.packages.length:APP_DATA.packages.filter(p=>p.status===x).length}</button>`).join('')}<div class="toolbar-spacer"></div><select class="field" data-package-category aria-label="套餐分类">${cats.map(c=>`<option ${UI.packageCategory===c?'selected':''}>${c}</option>`).join('')}</select></div>${list.length?`<div class="package-grid">${list.map((p,i)=>`<div class="card package-card"><div class="package-cover" style="background:${i%3===0?'linear-gradient(135deg,#d4c2a4,#f4dfbd 46%,#b5d2c9)':i%3===1?'linear-gradient(135deg,#cad8d4,#e9eee8 45%,#e6c2ac)':'linear-gradient(135deg,#c5b8d9,#f0e8e2 48%,#dacda8)'}"><span class="package-status">${status(p.status,toneFor(p.status))}</span></div><h3>${esc(p.name)}</h3><p>${p.duration}h · ${p.retouchCount} 张精修 · ${money(p.addOnUnitPrice)}/张加选</p><div class="package-price"><strong>${money(p.basePrice)}</strong><span>当前版本 V${p.version}</span></div><div class="package-meta"><span class="pill">${esc(p.category)}</span><span class="pill mint">定金 ${p.depositRate}% · 按基础价</span></div><div class="package-actions"><button class="ghost-btn" data-action="open-modal" data-kind="package" data-id="${p.packageId}"     function renderFinance(){const verified=APP_DATA.orders.reduce((n,o)=>n+o.verifiedReceived,0),declared=APP_DATA.orders.filter(o=>o.paymentStatus==='待核验').reduce((n,o)=>n+o.declaredDeposit,0),remaining=APP_DATA.orders.reduce((n,o)=>n+orderFinancial(o).outstanding,0),total=APP_DATA.orders.reduce((n,o)=>n+o.total,0);return `<div class="page-wrap"><div class="page-head"><div><h1>财务与对账</h1><p>已确认到账、待核验申报和订单剩余应收分开统计。</p></div><div class="page-actions"><button class="ghost-btn" data-action="export" data-kind="finance">${icon('download')}导出对账</button><button class="primary-btn" data-action="open-modal" data-kind="payment-settings">${icon('wallet')}管理收款方式</button></div></div><div class="stats"><div class="card stat-card"><div class="stat-top"><span>订单总额</span><div class="stat-icon">${icon('wallet')}</div></div><div class="stat-value">${money(total)}</div><div class="stat-foot">全部演示订单金额</div></div><div class="card stat-card mint"><div class="stat-top"><span>已确认到账</span><div class="stat-icon">${icon('check')}</div></div><div class="stat-value">${money(verified)}</div><div class="stat-foot">不含待核验申报</div></div><div class="card stat-card lav"><div class="stat-top"><span>待核验申报</span><div class="stat-icon">${icon('clock')}</div></div><div class="stat-value">${money(declared)}</div><div class="stat-foot">确认后才计入已收</div></div><div class="card stat-card yellow"><div class="stat-top"><span>订单剩余应收</span><div class="stat-icon">${icon('warning')}</div></div><div class="stat-value">${money(remaining)}</div><div class="stat-foot">包含待核验申报金额</div></div></div><div class="section-title"><h2>收款流水</h2><span>点击待核验流水进入二次确认</span></div><div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>订单</th><th>客户</th><th>收款类型</th><th>申报/到账金额</th><th>方式</th><th>状态</th><th></th></tr></thead><tbody>${APP_DATA.orders.map(o=>{const c=customer(o.customerId),amount=o.paymentStatus==='待核验'?o.declaredDeposit:o.verifiedReceived;return `<tr ${o.paymentStatus==='待核验'?`data-open="     function renderOrderDetail(id){const o=order(id);if(!o)return drawerHeader('订单不存在','请返回列表重新选择');const c=customer(o.customerId),p=pkg(o.packageId),f=orderFinancial(o);let panel='';if(UI.drawerTab==='overview')panel=`<div class="page-note">${icon(o.paymentStatus==='待核验'?'warning':'clock')} ${o.paymentStatus==='待核验'?`客户已申报转账 ${money(o.declaredDeposit)}，尚未计入已确认到账。`:`${formatDateTime(o.shootAt)} · ${o.location} · ${o.status}`}</div><div class="info-grid"><div class="info-box"><span>基础套餐价</span><strong>${money(o.basePrice)}</strong></div><div class="info-box"><span>加选精修</span><strong>${o.addOnQty} × ${money(o.addOnUnitPrice)} = ${money(f.addOnAmount)}</strong></div><div class="info-box"><span>订单总额</span><strong>${money(f.total)}</strong></div><div class="info-box"><span>已确认到账</span><strong>${money(o.verifiedReceived)}</strong></div><div class="info-box"><span>待核验定金</span><strong>${o.paymentStatus==='待核验'?money(o.declaredDeposit):money(0)}</strong></div><div class="info-box"><span>核验后尾款</span><strong>${money(f.balance)}</strong></div></div><div class="drawer-section" style="margin-top:22px"><h3>订单信息</h3><div class="kv-list"><div class="kv"><span>订单号</span><strong>${o.orderId}</strong></div><div class="kv"><span>客户</span><strong>${esc(c.name)} · ${esc(c.phoneMasked)}</strong></div><div class="kv"><span>套餐版本</span><strong>${esc(p?.name||o.service)} V${p?.version||1}</strong></div><div class="kv"><span>拍摄时间</span><strong>${formatDateTime(o.shootAt)}</strong></div><div class="kv"><span>拍摄地点</span><strong>${esc(o.location)}</strong></div><div class="kv"><span>负责人</span><strong>${esc(o.owner)}</strong></div><div class="kv"><span>来源</span><strong>${esc(o.source)}</strong></div></div></div>`;if(UI.drawerTab==='payments')panel=`<div class="notice-box">定金按基础套餐价 ${money(o.basePrice)} × ${o.depositRate}% 计算；加选精修 ${money(f.addOnAmount)} 全部进入尾款。</div><div class="drawer-section" style="margin-top:18px"><div class="kv"><span>客户申报定金</span><strong>${money(o.declaredDeposit)}</strong></div><div class="kv"><span>核验状态</span><strong>${status(o.paymentStatus,toneFor(o.paymentStatus))}</strong></div><div class="kv"><span>已确认到账</span><strong>${money(o.verifiedReceived)}</strong></div><div class="kv"><span>订单剩余应收</span><strong>${money(f.outstanding)}</strong></div><div class="kv"><span>核验后待收尾款</span><strong>${money(f.balance)}</strong></div></div>`;if(UI.drawerTab==='files')panel=`<div class="drawer-section"><h3>文件管理</h3><div class="activity-list"><div class="activity"><strong>原片与样片</strong><span>由交付任务统一管理；当前任务 ${APP_DATA.deliveries.filter(d=>d.orderId===o.orderId).length} 个</span></div><div class="activity"><strong>高清下载</strong><span>仅在尾款确认后开放；当前为原型演示</span></div></div><button class="ghost-btn" style="margin-top:12px" data-view="delivery">前往选片与精修</button></div>`;if(UI.drawerTab==='log')panel=`<div class="drawer-section"><h3>操作时间线</h3><div class="drawer-timeline">${o.timeline.map((t,i)=>`<div class="timeline-row ${i===0?'pending':''}"><i class="timeline-dot"></i><div class="timeline-copy"><strong>${esc(t.title)}</strong><span>${esc(t.time)} · ${esc(t.actor)}</span></div></div>`).join('')}</div></div>`;return `${drawerHeader(`${c.name} · ${o.service}`,`${o.orderId} · ${formatDateTime(o.shootAt)} · ${o.location}`)}<div class="drawer-body">${drawerTabs([['overview','订单概览'],['payments','收款记录'],['files','文件管理'],['log','操作日志']])}<div class="drawer-panel">${panel}</div></div><div class="drawer-actions"><button class="ghost-btn" data-action="open-modal" data-kind="message" data-id="${c.customerId}">发送消息</button><button class="ghost-btn" data-action="prototype" data-message="改期与退款申请将在开发版接入审批流">改期 / 退款</button>${o.paymentStatus==='待核验'?`<button class="primary-btn" data-open="payment" data-id="${o.orderId}">核验定金 ${icon('arrow')}</button>`:`<button class="primary-btn" data-action="prototype" data-message="拍摄现场将在移动端执行">进入拍摄现场 ${icon('arrow')}</button>`}</div>`}

    function modalCustomerPreview(){const p=APP_DATA.packages.filter(x=>x.status==='已上架')[0];return modalFrame('客户预约页预览',`<div class="quote-preview"><span class="prototype-label">客户 H5 预览</span><h4 style="margin-top:14px">${esc(APP_DATA.workspace.name)}</h4><p style="color:var(--muted);font-size:12px">自然、可信、清晰的摄影预约体验</p><div class="package-cover" style="height:130px;margin:14px 0"></div><div class="kv"><span>推荐套餐</span><strong>${esc(p.name)}</strong></div><div class="kv"><span>基础套餐价</span><strong>${money(p.basePrice)}</strong></div><div class="kv"><span>定金</span><strong>${p.depositRate}% · 按基础套餐价</strong></div></div>`,`<button class="ghost-btn" data-action="copy-link" data-kind="booking">复制演示链接</button><button class="primary-btn" data-action="close-modal">关闭预览</button>`)}

    function modalContent(kind,id){if(kind==='quick')return modalFrame('快速创建',`<div class="quick-grid"><button class="quick-option" data-action="open-modal" data-kind="order"><div class="q-icon">${icon('order')}</div><div><strong>录入订单</strong><span>创建订单并计算定金、加选和尾款</span></div></button><button class="quick-option" data-action="open-modal" data-kind="lead"><div class="q-icon">${icon('chat')}</div><div><strong>新建线索</strong><span>从已有客户中选择并记录需求</span></div></button><button class="quick-option" data-action="open-modal" data-kind="customer"><div class="q-icon">${icon('users')}</div><div><strong>添加客户</strong><span>独立客户表单与校验</span></div></button><button class="quick-option" data-action="open-modal" data-kind="delivery"><div class="q-icon">${icon('image')}</div><div><strong>新建交付任务</strong><span>进入对应交付阶段</span></div></button><button class="quick-option" data-action="open-modal" data-kind="block"><div class="q-icon">${icon('calendar')}</div><div><strong>关闭时段</strong><span>同步周、月和资源视图</span></div></button><button class="quick-option" data-action="open-modal" data-kind="package"><div class="q-icon">${icon('box')}</div><div><strong>新建套餐</strong><span>创建独立套餐版本</span></div></button></div>`);if(kind==='customer')return modalCustomer();if(kind==='package')return modalPackage(id);if(kind==='delivery')return modalDelivery();if(kind==='quote')return modalQuote(id);if(kind==='payment-confirm')return modalPaymentConfirm(id);if(kind==='order')return modalOrder(id);if(kind==='lead')return modalLead();if(kind==='block'){const parts=String(id||'').split('|');return modalBlock(parts[0]||'2026-08-09',parts[1]||'13:00')}if(kind==='work')return modalWork(id);if(kind==='order-filter')return modalOrderFilter();if(kind==='tag-filter')return modalTagFilter();if(kind==='workspace')return modalWorkspace();if(kind==='help')return modalHelp();if(kind==='payment-settings')return modalPaymentSettings();if(kind==='message')return modalMessage(id);if(kind==='customer-preview')return modalCustomerPreview();return modalFrame('原型操作',`<p>该功能将在开发版继续完善。</p>`)}

    function updateCalculatedForm(kind){if(kind==='quote'){const form=document.getElementById('quoteForm'),box=document.getElementById('quoteSummary');if(!form||!box)return;const v=formValues(form),p=pkg(v.packageId)||APP_DATA.packages[0],rate=p.depositRate,base=Number(v.baseAmount||0),add=Number(v.addOnQty||0)*Number(v.addOnUnitPrice||0),deposit=Math.round(base*rate/100),total=base+add,balance=total-deposit;box.innerHTML=`<h4>报价金额预览</h4><div class="kv"><span>基础金额</span><strong>${money(base)}</strong></div><div class="kv"><span>加选金额</span><strong>${money(add)}</strong></div><div class="kv"><span>报价总额</span><strong>${money(total)}</strong></div><div class="kv"><span>定金（基础价 × ${rate}%）</span><strong>${money(deposit)}</strong></div><div class="kv"><span>尾款（含全部加选）</span><strong>${money(balance)}</strong></div><div class="formula-box">${money(base)} × ${rate}% = ${money(deposit)}；${money(add)} 加选费用全部进入尾款。</div>`}if(kind==='order'){const form=document.getElementById('orderForm'),box=document.getElementById('orderSummary');if(!form||!box)return;const v=formValues(form),p=pkg(v.packageId)||APP_DATA.packages[0],add=Number(v.addOnQty||0)*p.addOnUnitPrice,deposit=Math.round(p.basePrice*p.depositRate/100),total=p.basePrice+add,balance=total-deposit;box.innerHTML=`<h4>订单金额预览</h4><div class="kv"><span>基础套餐价</span><strong>${money(p.basePrice)}</strong></div><div class="kv"><span>加选精修</span><strong>${Number(v.addOnQty||0)} × ${money(p.addOnUnitPrice)} = ${money(add)}</strong></div><div class="kv"><span>订单总额</span><strong>${money(total)}</strong></div><div class="kv"><span>待收定金</span><strong>${money(deposit)}</strong></div><div class="kv"><span>定金确认后尾款</span><strong>${money(balance)}</strong></div>`}}
    function markFieldError(form,name,msg){const el=form.elements[name];el?.closest('.form-field')?.classList.add('invalid');const er=form.querySelector(`[data-error-for="${name}"]`);if(er)er.textContent=msg}

      const policy=APP_DATA.refundPolicy.find(p=>p.rate===r.refundRate)||refundPolicyFor(o,r.requestedAt),stage=refundStageIndex(r),c=customer(o.customerId),paid=refundPaidAmount(o);

nt"><div class="stat-top"><span>净已确认到账</span><div class="stat-icon">${icon('check')}</div></div><div class="stat-value">${money(net)}</div><div class="stat-foot">已收 ${money(gross)} · 退款 ${money(completedRefunds)}</div></div><div class="card stat-card lav"><div class="stat-top"><span>退款待处理</span><div class="stat-icon">${icon('refund')}</div></div><div class="stat-value">${pendingRefunds.length}</div><div class="stat-foot">待审核 ${pendingRefunds.filter(r=>r.status==='待审核').length} · 待退款 ${pendingRefunds.filter(r=>r.status==='待退款').length}</div></div><div class="card stat-card yellow"><div class="stat-top"><span>订单剩余应收</span><div class="stat-icon">${icon('warning')}</div></div><div class="stat-value">${money(remaining)}</div><div class="stat-foot">待核验申报 ${money(declared)}</div></div></div><div class="section-title"><h2>退款与收款流水</h2><div class="refund-toolbar"><span class="status orange">退款待处理 ${pendingRefunds.length}</span><span class="status mint">已完成退款 ${money(completedRefunds)}</span></div></div><div class="card table-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>时间</th><th>订单 / 客户</th><th>类型</th><th>金额</th><th>方式</th><th>状态</th><th></th></tr></thead><tbody>${refundRows}${paymentRows}</tbody></table></div></div></div>`};
    const slotModalWithUpload=modalContent;
    modalContent=function(kind,id){if(kind==='upload')return modalUpload(id);if(kind==='delivery-transition')return modalDeliveryTransition(id);if(kind==='payment-edit')return modalPaymentMethod(id);if(kind==='refund')return modalRefund(id);if(kind==='refund-confirm')return modalRefundConfirm(id);if(kind==='refund-approve-confirm')return modalRefundApproveConfirm(id);if(kind==='refund-reject')return modalRefundReject(id);return slotModalWithUpload(kind,id)};

    document.addEventListener('click',e=>{
