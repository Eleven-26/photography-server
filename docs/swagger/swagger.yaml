      CustomerStatusActive: 活跃
      CustomerStatusInactive: 流失/沉睡
      CustomerStatusPotential: 潜在
    x-enum-descriptions:
    - 潜在
    - 活跃
    - 流失/沉睡
    x-enum-varnames:
    - CustomerStatusPotential
