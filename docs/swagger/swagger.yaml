basePath: /
definitions:
  contract.AuditReq:
    properties:
      approved:
        description: 审批结论 true-通过 false-驳回
        type: boolean
      remark:
        description: 审批备注
        type: string
    type: object
  contract.ChangePasswordReq:
    properties:
      new_password:
        description: 新密码
        type: string
      old_password:
        description: 原密码
        type: string
    required:
    - new_password
    - old_password
    type: object
  contract.CustomerCreateReq:
    properties:
      allow_notifications:
        description: AllowNotifications 用指针：创建时不传默认允许(1)，显式传 0 表示不允许。
        type: integer
      avatar:
        description: 头像URL
        type: string
      birthday:
        description: 生日
        type: string
      gender:
        description: '性别: male/female/unknown'
        type: string
      level:
        allOf:
        - $ref: '#/definitions/enum.CustomerLevel'
        description: 客户等级 1-普通 2-黄金 3-铂金 4-钻石
      mobile:
        description: 手机号
        type: string
      name:
        description: 客户姓名
        type: string
      prefer_scene:
        description: 常用场景
        type: string
      prefer_style:
        description: 偏好风格
        type: string
      remark:
        description: 备注
        type: string
      source:
        description: 来源
        type: string
      status:
        allOf:
        - $ref: '#/definitions/enum.CustomerStatus'
        description: 状态 1-潜在 2-活跃 3-流失
      store_id:
        description: 门店ID
        type: integer
      tags:
        description: 标签，逗号分隔
        type: string
      wechat:
        description: 微信号
        type: string
    required:
    - name
    type: object
  contract.CustomerListReq:
    properties:
      keyword:
        description: 姓名/手机号关键字
        type: string
      page:
        description: 页码，默认 1
        type: integer
      page_size:
        description: 每页条数，默认 20，上限 200
        type: integer
    type: object
  contract.CustomerStatsResp:
    properties:
      active:
        description: 活跃数（status=2）
        type: integer
      gold_up:
        description: 黄金及以上等级数
        type: integer
      inactive:
        description: 非活跃数（status=3）
        type: integer
      new_this_month:
        description: 本月新增
        type: integer
      potential:
        description: 潜在客户数（status=1）
        type: integer
      repurchase_count:
        description: —— 复购口径（原型「复购客户 / 复购率」）——
        type: integer
      repurchase_rate:
        description: 复购率 %（分母为有过下单的客户）
        type: number
      total:
        description: 总数
        type: integer
    type: object
  contract.CustomerUpdateReq:
    properties:
      allow_notifications:
        description: |-
          AllowNotifications 用指针：nil 表示未传（保持原值），显式 0 表示关闭通知。
          若用值类型，「关闭通知」会被零值语义吞掉而静默回退（同 Asset.featured 的历史缺陷）。
        type: integer
      avatar:
        description: 头像URL
        type: string
      birthday:
        description: 生日
        type: string
      gender:
        description: '性别: male/female/unknown'
        type: string
      id:
        description: 客户ID（body 主键）
        type: integer
      level:
        allOf:
        - $ref: '#/definitions/enum.CustomerLevel'
        description: 客户等级 1-普通 2-黄金 3-铂金 4-钻石
      mobile:
        description: 手机号
        type: string
      name:
        description: 客户姓名
        type: string
      prefer_scene:
        description: 常用场景
        type: string
      prefer_style:
        description: 偏好风格
        type: string
      remark:
        description: 备注
        type: string
      source:
        description: 来源
        type: string
      status:
        allOf:
        - $ref: '#/definitions/enum.CustomerStatus'
        description: 状态 1-潜在 2-活跃 3-流失
      store_id:
        description: 门店ID
        type: integer
      tags:
        description: 标签，逗号分隔
        type: string
      wechat:
        description: 微信号
        type: string
    type: object
  contract.LoginReq:
    properties:
      password:
        description: 密码
        type: string
      username:
        description: 用户名
        type: string
    required:
    - password
    - username
    type: object
  contract.LoginResp:
    properties:
      token:
        description: JWT Token
        type: string
      user:
        allOf:
        - $ref: '#/definitions/contract.UserInfoVO'
        description: 用户信息（含角色与权限）
    type: object
  contract.OrderAddonCreateReq:
    properties:
      category:
        description: 分类 makeup-妆造 urgency-时效 service-服务 retouch-精修
        type: string
      confirmed:
        description: 客户是否确认 0-待确认 1-已确认
        type: integer
      name:
        description: 加项名称
        type: string
      order_id:
        description: 订单ID（body 主键）
        type: integer
      price:
        description: 单价
        type: number
      qty:
        description: 数量（<=0 按 1 计）
        type: integer
      remark:
        description: 备注
        type: string
    required:
    - name
    type: object
  contract.OrderAddonUpdateReq:
    properties:
      category:
        description: 分类 makeup-妆造 urgency-时效 service-服务 retouch-精修
        type: string
      confirmed:
        description: 客户是否确认 0-待确认 1-已确认
        type: integer
      id:
        description: 加项ID（body 主键）
        type: integer
      name:
        description: 加项名称
        type: string
      price:
        description: 单价
        type: number
      qty:
        description: 数量（<=0 按 1 计）
        type: integer
      remark:
        description: 备注
        type: string
    required:
    - name
    type: object
  contract.OrderCancelReq:
    properties:
      reason:
        description: 取消原因
        type: string
    type: object
  contract.OrderCreateReq:
    properties:
      addon_amount:
        description: 加选金额
        type: number
      customer_id:
        description: 客户ID
        type: integer
      lead_id:
        description: 线索ID（从线索转化时传）
        type: integer
      owner_id:
        description: 负责人ID
        type: integer
      package_id:
        description: 套餐ID
        type: integer
      photographer:
        description: 摄影师姓名
        type: string
      photographer_id:
        description: 摄影师ID
        type: integer
      quote_id:
        description: 报价单ID
        type: integer
      remark:
        description: 备注
        type: string
      shoot_address:
        description: 拍摄地址
        type: string
      shoot_date:
        description: 拍摄日期
        type: string
      shoot_time:
        description: 拍摄时段
        type: string
    required:
    - package_id
    type: object
  contract.OrderDetail:
    properties:
      allowed_transitions:
        description: |-
          AllowedTransitions 当前状态允许流转到的目标状态（领域状态机输出）。
          前端据此渲染「阶段推进」按钮，避免在客户端重复实现状态机导致规则漂移。
        items:
          type: integer
        type: array
      delivery:
        allOf:
        - $ref: '#/definitions/model.Delivery'
        description: 交付信息（未创建交付单时为 null）
      logs:
        description: 操作日志
        items:
          $ref: '#/definitions/model.OrderLog'
        type: array
      order:
        allOf:
        - $ref: '#/definitions/model.Order'
        description: 订单信息
      payments:
        description: 收款记录
        items:
          $ref: '#/definitions/model.OrderPayment'
        type: array
      refunds:
        description: 退款记录
        items:
          $ref: '#/definitions/model.OrderRefund'
        type: array
    type: object
  contract.OrderListReq:
    properties:
      customer_id:
        description: 客户ID过滤
        type: integer
      page:
        description: 页码，默认 1
        type: integer
      page_size:
        description: 每页条数，默认 20，上限 200
        type: integer
      status:
        description: 订单状态过滤
        type: string
    type: object
  contract.OrderStatusReq:
    properties:
      content:
        description: 状态变更说明
        type: string
      status:
        description: 目标状态
        type: integer
    required:
    - status
    type: object
  contract.OrderUpdateReq:
    properties:
      id:
        description: 订单ID（body 主键）
        type: integer
      photographer:
        description: 摄影师姓名
        type: string
      photographer_id:
        description: 摄影师ID
        type: integer
      remark:
        description: 备注
        type: string
      shoot_address:
        description: 拍摄地址
        type: string
      shoot_date:
        description: 拍摄日期
        type: string
      shoot_time:
        description: 拍摄时段
        type: string
    type: object
  contract.PageReq:
    properties:
      page:
        description: 页码，默认 1
        type: integer
      page_size:
        description: 每页条数，默认 20，上限 200
        type: integer
    type: object
  contract.PaymentCreateReq:
    properties:
      amount:
        description: 金额
        type: number
      method_id:
        description: 收款方式ID
        type: integer
      order_id:
        description: 订单ID（body 主键）
        type: integer
      paid_at:
        description: 付款时间
        type: string
      remark:
        description: 备注
        type: string
      type:
        description: '类型: deposit-定金, final-尾款, addon-加选'
        type: string
      voucher:
        description: 凭证URL
        type: string
    required:
    - amount
    - type
    type: object
  contract.RefundCreateReq:
    properties:
      amount:
        description: 退款金额，为空时按规则自动计算
        type: number
      reason:
        description: 退款原因
        type: string
    type: object
  contract.RescheduleApplyReq:
    properties:
      new_date:
        description: 新拍摄日期
        type: string
      new_time:
        description: 新拍摄时段
