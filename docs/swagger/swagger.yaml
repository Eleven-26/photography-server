          type: string
        type: array
      role_code:
        description: 角色编码 admin/manager/photographer/sales
        type: string
      role_id:
        type: integer
      role_name:
        description: 角色名称
        type: string
      status:
        type: integer
      store_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: integer
      username:
        type: string
    type: object
  enum.CustomerLevel:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-comments:
      CustomerLevelDiamond: 钻石
      CustomerLevelGold: 黄金
      CustomerLevelNormal: 普通
      CustomerLevelPlatinum: 铂金
    x-enum-descriptions:
    - 普通
    - 黄金
    - 铂金
    - 钻石
    x-enum-varnames:
    - CustomerLevelNormal
    - CustomerLevelGold
    - CustomerLevelPlatinum
    - CustomerLevelDiamond
  enum.CustomerStatus:
    enum:
